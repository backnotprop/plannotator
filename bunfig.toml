[install]
linker = "isolated"
minimumReleaseAge = 604800  # 7 days in seconds
minimumReleaseAgeExcludes = ["@pierre/diffs", "@pierre/theme", "@pierre/theming", "@plannotator/atomic-editor", "@plannotator/markdown-editor", "@plannotator/webtui"]

[test]
preload = ["./tests/setup/gh-tripwire.ts", "./tests/setup/feedback-archive-off.ts", "./packages/ui/test-setup/happy-dom.ts"]
# The Claude Code mod's engine-harness tests run under `claude plugin test`
# (scripts/test-claude-code-mod.sh), not bun: they import 'claude-code/testing'.
# The Inbox's browser proofs run under Playwright (`bun run test:e2e:inbox`),
# against a compiled binary, not under bun test.
# The relay's proof (apps/relay/test) runs `wrangler dev`: it runs from its own
# folder in the relay workflow, not in the root run. The usage-counts Worker's
# proof (apps/telemetry/test) runs `wrangler dev` too, from its own folder.
pathIgnorePatterns = ["apps/hook/tests/**", "tests/e2e/**", "apps/relay/**", "apps/telemetry/**"]

# Load image and video assets as files, never as JavaScript. Bun 1.3 loses the
# file treatment of an extension it has no loader for once the file importing it
# is past 50 KiB and served from the runtime transpiler cache, then parses the
# asset as JS ("Expected ;" in tater-sidebar.webp, #2154). Bun 1.4.4 does not;
# the explicit loader still states the intent and covers an older Bun.
# tests/package-bunfig.test.ts keeps this list in step with the assets the
# source imports, and every package bunfig in step with this one.
[loader]
".webp" = "file"
".png" = "file"
".webm" = "file"
".mp4" = "file"
