  # ================================================================ inbox
  i_claude:
    from: iclaude
    to: iserver
    both: true
    says: tool calls on /mcp, then a long-poll for your reply
    carries: plannotator_inbox; /api/inbox/bridge/poll with the registry's token.
    code: { from: apps/hook/hooks/mod/inbox.ts, to: packages/server/inbox.ts }
  i_plugins:
    from: iplugins
    to: iserver
    both: true
    says: the same tool and long-poll
    code: { from: packages/shared/inbox/agent-link.ts, to: packages/server/inbox.ts }
  i_stdio:
    from: [ imcp, icodex, iqwen ]
    to: shim
    says: MCP over stdio
    code: { to: apps/hook/server/inbox-mcp-shim.ts }
  i_t3stdio:
    from: it3
    to: shim
    says: MCP over stdio, as host t3
    carries: Inside a T3 thread the shim reads T3CODE_THREAD_ID and files the calls as host t3, session the thread id. The --t3 entry only lists no tools outside a T3 thread.
    code: { from: packages/core/inbox-t3.ts, to: apps/hook/server/inbox-mcp-shim.ts }
  i_shim:
    from: shim
    to: iserver
    says: POST /mcp on loopback
    carries: The port is read from inbox.json on each call; a stopped Inbox is started.
    code: { from: apps/hook/server/inbox-mcp-shim.ts, to: packages/server/inbox-mcp.ts }
  i_wcodex:
    from: iserver
    to: icodex
    says: codex queue --thread
    code: { from: packages/server/inbox-codex-wake.ts }
  i_wqwen:
    from: iserver
    to: iqwen
    says: into the running session
    code: { from: packages/server/inbox-qwen-wake.ts }
  i_wt3:
    from: iserver
    to: it3
    says: t3_thread_send
    carries: "Your reply as a queued turn in the T3 thread (t3_thread_read finds it first), under the grant plannotator t3 login saved."
    code: { from: packages/server/inbox-t3-wake.ts, to: packages/t3-code/t3-client.ts }
  i_setup:
    from: isetup
    to: imcp
    says: adds a plannotator-inbox entry
    code: { from: packages/server/inbox-agents.ts }
  i_store:
    from: iserver
    to: istore
    says: appends lines
    code: { from: packages/server/inbox.ts, to: packages/shared/inbox/store.ts }
  i_reg:
    from: iserver
    to: iregistry
    says: pid, port, token
    code: { to: packages/shared/inbox/registry.ts }
  i_page:
    from: iwindow
    to: iserver
    both: true
    says: REST and one event stream
    code: { from: packages/inbox/api.ts, to: packages/server/inbox.ts }
  i_you:
    from: you
    to: iwindow
    says: reads and answers
  i_links:
    from: iserver
    to: ilinks
    both: true
    says: door requests and events
    code: { from: packages/server/inbox-transport-tailnet.ts }
  i_relay:
    from: irelayc
    to: relay
    says: mailbox, sealed items, pushes
    code: { from: packages/server/inbox-relay.ts }
  i_door:
    from: phones
    to: idoor
    says: reads and commands, bearer token
    code: { to: packages/server/inbox-devices.ts }
  i_launch:
    from: ilaunch
    to: iclaude
    says: starts claude --bg
    code: { from: packages/server/inbox-launch-claude.ts }

