.theme-plannotator {
  --background: oklch(0.15 0.02 260);
  --foreground: oklch(0.90 0.01 260);
  --card: oklch(0.22 0.02 260);
  --popover: oklch(0.28 0.025 260);
  --primary: oklch(0.75 0.18 280);
  --primary-foreground: oklch(0.15 0.02 260);
  --muted: oklch(0.26 0.02 260);
  --muted-foreground: oklch(0.72 0.02 260);
  --destructive: oklch(0.65 0.20 25);
  --border: oklch(0.35 0.02 260);
  --ring: oklch(0.75 0.18 280);
  --success: oklch(0.72 0.17 150);
  --warning: oklch(0.75 0.15 85);
  --font-sans: 'Inter Variable', 'Inter', system-ui, sans-serif;
  --font-mono: 'Geist Mono Variable', 'Geist Mono', ui-monospace, monospace;

  --shadow-ink: oklch(from var(--background) calc(l * 0.2) calc(c * 0.5) h);
  --ground: color-mix(in oklch, color-mix(in oklch, var(--background) 82%, var(--shadow-ink)) 35%, oklch(from var(--card) calc(l - 0.08) c h));
  --pane: var(--card);
  --pane-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 6%, transparent), inset 0 1px 0 color-mix(in oklch, var(--foreground) 4%, transparent), 0 8px 24px -10px color-mix(in oklch, var(--shadow-ink) 60%, transparent);
  --float-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 8%, transparent), inset 0 1px 0 color-mix(in oklch, var(--foreground) 5%, transparent), 0 16px 40px -12px color-mix(in oklch, var(--shadow-ink) 75%, transparent);
  --raise: oklch(from var(--card) calc(l + 0.035) c h);
  --hover: color-mix(in oklch, var(--foreground) 6%, transparent);
  --hair: color-mix(in oklch, var(--foreground) 8%, transparent);
  --tint: color-mix(in oklch, var(--primary) 16%, transparent);
  --tint-fg: var(--primary);
  --quiet-fg: color-mix(in oklch, var(--muted-foreground) 88%, var(--card));
  --ok-fg: var(--success);
  --hold-fg: color-mix(in oklab, var(--warning) 80%, var(--foreground));
  --paper: oklch(0.25 0.018 260);
  --paper-ink: oklch(0.86 0.01 260);
  --paper-soft: oklch(0.70 0.015 260);
  color-scheme: dark;
}
.theme-plannotator.light {
  --background: oklch(0.97 0.005 260);
  --foreground: oklch(0.18 0.02 260);
  --card: oklch(1 0 0);
  --popover: oklch(1 0 0);
  --primary: oklch(0.50 0.25 280);
  --primary-foreground: oklch(1 0 0);
  --muted: oklch(0.92 0.01 260);
  --muted-foreground: oklch(0.40 0.02 260);
  --destructive: oklch(0.50 0.25 25);
  --border: oklch(0.88 0.01 260);
  --ring: oklch(0.50 0.25 280);
  --success: oklch(0.45 0.20 150);
  --warning: oklch(0.55 0.18 85);

  --shadow-ink: var(--foreground);
  --ground: color-mix(in oklch, color-mix(in oklch, var(--muted) 55%, var(--background)) 35%, oklch(from var(--card) calc(l - 0.08) c h));
  --pane-shadow: 0 0 0 1px color-mix(in oklch, var(--border) 55%, transparent), 0 1px 2px color-mix(in oklch, var(--shadow-ink) 5%, transparent), 0 6px 18px -8px color-mix(in oklch, var(--shadow-ink) 12%, transparent);
  --float-shadow: 0 0 0 1px color-mix(in oklch, var(--border) 70%, transparent), 0 1px 2px color-mix(in oklch, var(--shadow-ink) 4%, transparent), 0 12px 32px -10px color-mix(in oklch, var(--shadow-ink) 20%, transparent);
  --raise: oklch(0.975 0.004 260);
  --hover: color-mix(in oklch, var(--foreground) 5%, transparent);
  --hair: color-mix(in oklch, var(--foreground) 8%, transparent);
  --tint: color-mix(in oklch, var(--primary) 10%, transparent);
  --quiet-fg: var(--muted-foreground);
  --ok-fg: oklch(0.42 0.16 150);
  --hold-fg: oklch(0.45 0.12 75);
  --paper: oklch(1 0 0);
  --paper-ink: oklch(0.22 0.02 260);
  --paper-soft: oklch(0.45 0.02 260);
  color-scheme: light;
}

/* Round three: the Inbox shell as it ships (packages/inbox/inbox.css: .ib-side, .ib-brand, .ib-nav, .ib-cpill,
   soft panes with an 8px gutter and a 10px radius). Type: 12, 13, 14, 15, 20, 28. Weights 400, 500, 600. */
.theme-plannotator { --mark: color-mix(in oklab, var(--primary) 16%, transparent); --mark-line: color-mix(in oklab, var(--primary) 55%, transparent); --ok: var(--success); --ask: color-mix(in oklab, var(--warning) 85%, var(--foreground)); --step: color-mix(in oklch, var(--foreground) 5%, transparent); --text-2: color-mix(in oklch, var(--muted-foreground) 70%, var(--foreground)); }
.theme-plannotator.light { --mark: color-mix(in oklab, var(--primary) 11%, transparent); --mark-line: color-mix(in oklab, var(--primary) 45%, transparent); --ok: oklch(0.45 0.15 150); --ask: oklch(0.50 0.13 70); --step: color-mix(in oklch, var(--foreground) 4.5%, transparent); --text-2: color-mix(in oklch, var(--muted-foreground) 75%, var(--foreground)); }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font-sans); font-feature-settings: "cv01", "ss03"; font-size: 14px; line-height: 20px; color: var(--foreground); background: var(--ground); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
::selection { background: color-mix(in oklab, var(--primary) 28%, transparent); }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
* { scrollbar-width: thin; scrollbar-color: color-mix(in oklch, var(--foreground) 18%, transparent) transparent; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--font-mono); font-feature-settings: normal; font-variant-numeric: tabular-nums; }

.shell { display: flex; height: 100vh; min-height: 640px; }
.side { flex: none; width: 240px; display: flex; flex-direction: column; padding: 14px 10px 12px; color: var(--foreground); }
.brand { display: flex; align-items: center; gap: 9px; padding: 0 6px 10px; }
.tater { width: 38.5px; height: 44px; flex: none; overflow: hidden; transform: scaleX(-1); }
.tater i { display: block; width: 924px; height: 44px; background: var(--tater) left center / 924px 44px no-repeat; }
.brand b { font-size: 15px; font-weight: 600; }
.brand span { font-size: 15px; font-weight: 500; color: var(--muted-foreground); margin-left: -4px; }
.sfind { display: flex; gap: 8px; margin: 0 0 12px; }
.sfind label { flex: 1; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 10px; border-radius: 8px; border: 1px solid var(--hair); color: var(--muted-foreground); font-size: 14px; }
.sfind kbd, .key { font-family: var(--font-mono); font-size: 11px; line-height: 16px; padding: 0 4px; border-radius: 4px; background: var(--step); color: var(--muted-foreground); }
.sfind kbd { margin-left: auto; }
.sfind button { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--hair); color: var(--muted-foreground); }
.nav { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 9px; border-radius: 7px; font-size: 14px; }
.nav .ic { color: var(--muted-foreground); }
.nav .n { margin-left: auto; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
.nav[aria-current] { background: var(--card); box-shadow: 0 1px 2px color-mix(in oklch, var(--foreground) 8%, transparent), 0 0 0 1px color-mix(in oklch, var(--border) 50%, transparent); font-weight: 500; }
.nav[aria-current] .ic { color: var(--primary); }
.nav:hover:not([aria-current]) { background: var(--step); }
.sec { margin-top: 20px; }
.sec-h { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 9px; font-size: 14px; }
.sec-h .ic { color: var(--muted-foreground); }
.sec-h .gg { width: 16px; height: 16px; fill: var(--muted-foreground); }
.agent { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 9px 0 5px; border-radius: 7px; font-size: 14px; }
.agent:hover { background: var(--step); }
.hm { width: 24px; height: 24px; flex: none; display: grid; place-items: center; }
.hm svg, .hm img { width: 18px; height: 18px; display: block; }
.side-empty { margin: 0; padding: 4px 9px 0; font-size: 13px; line-height: 20px; color: var(--muted-foreground); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.cpill { display: flex; align-items: center; gap: 9px; width: max-content; height: 34px; margin: 0 0 8px; padding: 0 12px 0 10px; border: 1px solid var(--border); border-radius: 999px; font-size: 14px; }
.cpill .ags { display: inline-flex; gap: 3px; }
.cpill .ags svg, .cpill .ags img { width: 16px; height: 16px; display: block; }
.setrow { display: flex; align-items: center; }
.setrow .nav { flex: 1; }
.sq { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 7px; color: var(--muted-foreground); }

.main { flex: 1; min-width: 0; display: flex; gap: 8px; padding: 8px 8px 8px 0; }
.pane { background: var(--card); border-radius: 10px; box-shadow: var(--pane-shadow); min-width: 0; min-height: 0; overflow: auto; }

/* Controls, shared */
.btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background-color 150ms cubic-bezier(0.22, 1, 0.36, 1); }
.btn .ic { width: 16px; height: 16px; }
.btn-p { background: var(--primary); color: var(--primary-foreground); }
.btn-p:hover { background: color-mix(in oklch, var(--primary) 88%, var(--foreground)); }
.btn-p:active, .btn-q:active { transform: scale(0.98); }
.btn-q { background: var(--step); color: var(--foreground); }
.btn-q:hover { background: color-mix(in oklch, var(--foreground) 9%, transparent); }
.btn-l { height: 32px; padding: 0 10px; border-radius: 8px; color: var(--foreground); }
.btn-l:hover { background: var(--step); }
.field { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--step); color: var(--muted-foreground); font-size: 14px; min-width: 0; }
.field input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--foreground); }
.field input::placeholder { color: var(--muted-foreground); }
.sel { position: relative; display: inline-flex; align-items: center; }
.sel select { appearance: none; height: 32px; padding: 0 30px 0 10px; border: 0; border-radius: 8px; background: var(--step); color: var(--foreground); font-size: 14px; cursor: pointer; }
.sel .ic { position: absolute; right: 9px; width: 14px; height: 14px; color: var(--muted-foreground); pointer-events: none; }

/* The signature: a plan's draft trail. Drafts are numbered marks; your reviews sit between them; the end says whose move. */
.trail { display: inline-flex; align-items: center; gap: 0; flex: none; }
.trail .d { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 3px; border-radius: 4px; box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--foreground) 22%, transparent); font-family: var(--font-mono); font-size: 11px; line-height: 1; color: var(--text-2); font-variant-numeric: tabular-nums; }
.trail .d.head { color: var(--foreground); box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--foreground) 45%, transparent); }
.trail .j { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; }
.trail .j svg { width: 12px; height: 12px; stroke-width: 2; }
.trail .j.ok { color: var(--ok); }
.trail .j.ask { color: var(--ask); }
.trail .j.none::before { content: ""; width: 8px; height: 1px; background: color-mix(in oklch, var(--foreground) 25%, transparent); }
.trail .you { width: 12px; height: 12px; margin-left: 3px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--primary); }
.trail .them { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-left: 2px; }
.trail .them svg, .trail .them img { width: 14px; height: 14px; display: block; }
.trail .more { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); padding: 0 4px 0 0; }

/* The mock's own switch, kept out of the design */
.mockbar { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; gap: 8px; padding: 6px; border-radius: 12px; background: var(--popover); box-shadow: 0 0 0 1px var(--hair), 0 12px 32px -12px rgb(0 0 0 / 0.35); font-size: 12px; }
.mockbar div { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--step); }
.mockbar button { height: 24px; padding: 0 8px; border-radius: 6px; color: var(--muted-foreground); }
.mockbar button[aria-pressed="true"] { background: var(--card); color: var(--foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
body[data-shot] .mockbar { display: none; }

@media (max-width: 1000px) {
  .side { width: 220px; }
}

/* Plans home, round five. Type: 12, 13, 14, 15, 28. Weights 400, 500, 600. One filled button. */
.theme-plannotator { --paper: color-mix(in oklch, var(--card) 94%, var(--foreground)); --paper-edge: color-mix(in oklch, var(--foreground) 12%, transparent); --ink: var(--foreground); --ink-2: color-mix(in oklch, var(--foreground) 55%, transparent); --ink-3: color-mix(in oklch, var(--foreground) 22%, transparent); }
.theme-plannotator.light { --paper: oklch(1 0 0); --paper-edge: color-mix(in oklch, var(--foreground) 11%, transparent); }

.home, .room { flex: 1; overflow: auto; }

/* The hearth: the approved question over the still dither field */
.hearth { position: relative; padding: 12px 40px 40px 12px; }
.hearth .dither { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; -webkit-mask-image: linear-gradient(to bottom, #000 20%, transparent); mask-image: linear-gradient(to bottom, #000 20%, transparent); }
.hearth > :not(canvas) { position: relative; }
.hearth .hw { padding: 40px 0 0 36px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.hearth h1 { margin: 0; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.015em; }
.hearth.big { flex: 1; display: flex; flex-direction: column; }
.hearth.big .dither { -webkit-mask-image: none; mask-image: none; }
.hearth.big .tog { align-self: flex-start; }
.hearth.big .hw { margin: auto; max-width: 620px; padding: 24px; display: block; }
.hearth.big h1 { font-size: 40px; line-height: 44px; letter-spacing: -0.02em; margin-bottom: 12px; }
.hearth.big p { margin: 0 0 24px; font-size: 16px; line-height: 26px; color: var(--text-2); }
.home.first { display: flex; flex-direction: column; }

/* Sections. "Now" is large; everything else sits on ONE regular grid of one card size. A project is a run of
   columns on that grid with its name above it, so every card lines up whatever its project. */
.now, .rest { padding: 0 48px; }
.now h2, .prow h3 { margin: 0; font-size: 13px; line-height: 20px; font-weight: 500; color: var(--text-2); }
.now h2 { margin: 8px 0 16px; }
.grid { display: grid; gap: 28px 24px; }
.now-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.rest { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); grid-auto-flow: row dense; gap: 44px 24px; margin-top: 56px; padding-bottom: 64px; }
.hearth + .rest { margin-top: 24px; }
.prow { display: grid; grid-template-columns: subgrid; row-gap: 24px; align-content: start; min-width: 0; }
.prow h3 { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; height: 30px; padding-bottom: 8px; box-shadow: inset 0 -1px 0 var(--hair); }
.morelink { height: 26px; padding: 0 8px; margin-right: -8px; border-radius: 7px; font-size: 13px; font-weight: 400; color: var(--text-2); }
.morelink:hover { background: var(--step); }

/* THE CARD. A preview well (about three quarters of the card) on a quiet ground for its kind, then the title and
   one grey line. Grounds come from the Inbox's own token family, mixed into the card colour, so they hold in dark. */
.pc { --ease: cubic-bezier(0.22, 1, 0.36, 1); display: flex; flex-direction: column; min-width: 0; border-radius: 12px; overflow: hidden; background: var(--card); box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 9%, transparent); outline: none; isolation: isolate; transition: box-shadow 200ms var(--ease); }
.pc:hover, .pc.peek { box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 16%, transparent), 0 10px 24px -14px color-mix(in oklch, var(--shadow-ink) 30%, transparent); }
.pc:focus-visible { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--primary); }
.pv { position: relative; display: block; aspect-ratio: 4 / 3; overflow: hidden; --g: color-mix(in oklch, var(--foreground) 4%, var(--card)); background: var(--g); box-shadow: inset 0 -1px 0 color-mix(in oklch, var(--foreground) 7%, transparent); }
.pv-doc { --g: color-mix(in oklab, var(--primary) 8%, var(--card)); }
.pv-page { --g: color-mix(in oklch, var(--foreground) 5%, var(--card)); }
.pv-image { --g: color-mix(in oklab, var(--warning) 10%, var(--card)); }
.pv-data { --g: color-mix(in oklab, var(--success) 9%, var(--card)); }
.theme-plannotator:not(.light) .pv-doc { --g: color-mix(in oklab, var(--primary) 12%, var(--card)); }
.theme-plannotator:not(.light) .pv-image { --g: color-mix(in oklab, var(--warning) 12%, var(--card)); }
.theme-plannotator:not(.light) .pv-data { --g: color-mix(in oklab, var(--success) 11%, var(--card)); }
.pv-loading, .pv-none { --g: color-mix(in oklch, var(--foreground) 4%, var(--card)); }

/* What sits in the well. A document is paper: a sheet with one sheet behind, the same for every document, cropped by
   the card so it reads as continuing. A page is a flat window. An image or a data file sits flat, on no paper. */
.pin { position: absolute; left: 0; top: 0; width: calc(var(--w, 400) * 1px); transform-origin: 0 0; transform: scale(var(--s, 0.6)); color: var(--ink); }
.pin[data-w="420"] { --w: 420; } .pin[data-w="400"] { --w: 400; } .pin[data-w="320"] { --w: 320; }
.sheet, .win, .panel { position: absolute; background: var(--paper); transition: transform 240ms var(--ease); }
.sheet { left: 10%; right: 10%; top: 10%; bottom: -14px; border-radius: 6px 6px 0 0; box-shadow: 0 0 0 1px var(--paper-edge), 0 2px 8px -4px color-mix(in oklch, var(--shadow-ink) 18%, transparent); overflow: hidden; }
.sheet.back { transform: translate(2%, -5%) rotate(1.4deg); transform-origin: 50% 100%; box-shadow: 0 0 0 1px var(--paper-edge); background: color-mix(in oklch, var(--paper) 92%, var(--foreground)); }
.win { left: 8%; right: 8%; top: 9%; bottom: -10px; border-radius: 8px 8px 0 0; box-shadow: 0 0 0 1px var(--paper-edge), 0 2px 8px -4px color-mix(in oklch, var(--shadow-ink) 18%, transparent); overflow: hidden; }
.wbar { display: flex; gap: 4px; align-items: center; height: 16px; padding: 0 8px; box-shadow: inset 0 -1px 0 color-mix(in oklch, var(--foreground) 7%, transparent); }
.wbar i { width: 5px; height: 5px; border-radius: 50%; background: color-mix(in oklch, var(--foreground) 18%, transparent); }
.wbody { position: absolute; left: 0; right: 0; top: 16px; bottom: 0; overflow: hidden; }
.panel { left: 8%; right: 8%; top: 9%; bottom: 9%; border-radius: 6px; box-shadow: 0 0 0 1px var(--paper-edge); overflow: hidden; }
.panel.cells { bottom: -10px; border-radius: 6px 6px 0 0; }
.sheet.blank { background: transparent; box-shadow: none; outline: 1px dashed color-mix(in oklch, var(--foreground) 24%, transparent); outline-offset: -1px; }
.sheet.blank i { position: absolute; left: 12%; height: 1px; background: color-mix(in oklch, var(--foreground) 10%, transparent); }
.sheet.blank i:nth-child(1) { top: 24%; right: 30%; height: 2px; } .sheet.blank i:nth-child(2) { top: 40%; right: 12%; } .sheet.blank i:nth-child(3) { top: 52%; right: 24%; }
/* Loading placeholder: the well in its quiet ground, nothing inside, nothing loops. The title is already known. */

/* Motion 4, kept: hover or focus fans the sheet behind a document a little further; a window, image or data panel
   rises a hair. Press presses in a hair. */
:is(.pc:hover, .pc:focus-visible, .pc.peek) .sheet.back { transform: translate(3.5%, -7%) rotate(2.6deg); }
:is(.pc:hover, .pc:focus-visible, .pc.peek) :is(.win, .panel, .sheet.hero) { transform: translateY(-3px); }
.pc:active .hero, .pc.press .hero { transform: translateY(-1px) scale(0.985); }
.rm .sheet, .rm .win, .rm .panel { transition: none; }
.rm .pc:active .hero, .rm .pc.press .hero, .rm :is(.pc:hover, .pc:focus-visible, .pc.peek) :is(.win, .panel, .sheet.hero) { transform: none; }
.rm :is(.pc:hover, .pc:focus-visible, .pc.peek) .sheet.back { transform: translate(2%, -5%) rotate(1.4deg); }

/* Under the preview: the title, then ONE grey line (your move, the agent at work, or when it last changed) */
.cap { display: flex; flex-direction: column; gap: 2px; padding: 11px 14px 13px; min-width: 0; }
.pt { font-size: 14px; line-height: 20px; font-weight: 500; color: var(--foreground); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; text-wrap: pretty; }
.pc-lg .pt { font-size: 15px; line-height: 22px; }
.ud { display: inline-block; width: 7px; height: 7px; margin: 0 7px 0 0; border-radius: 50%; background: var(--primary); vertical-align: 1px; }
.pf { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--muted-foreground); white-space: nowrap; }
.pf .hm { width: 14px; height: 14px; }
.pf .hm svg, .pf .hm img { width: 13px; height: 13px; }
.pf-you { color: var(--primary); }

/* The document's own type, used on the sheet (scaled) and on the plan page (full size): the same top in both */
.dd h1 { margin: 0 0 12px; font-size: 26px; line-height: 32px; font-weight: 650; letter-spacing: -0.018em; text-wrap: balance; color: var(--foreground); }
.dd h2, .dd .fcap, .dd .fh { margin: 18px 0 8px; font-size: 15px; line-height: 22px; font-weight: 600; color: var(--foreground); }
.dd p { margin: 0 0 10px; font-size: 15px; line-height: 24px; color: color-mix(in oklch, var(--foreground) 82%, transparent); }
.dd .fp { padding: 0; font-size: 15px; line-height: 24px; }
.dd .fp p { font-size: 15px; line-height: 24px; color: color-mix(in oklch, var(--foreground) 82%, transparent); }
.dd .ft { font-size: 14px; line-height: 20px; }
.dd .ft td:first-child { font-size: 13px; }
.dd .fc { font-size: 13px; line-height: 20px; padding: 12px 14px; }
.dd .fl { font-size: 15px; line-height: 24px; }
.dd .fl li { margin-bottom: 2px; }
.dd .fl li::marker { font-size: 13px; }
.sheet .dd { display: block; padding: 34px 36px; }
.nothing { color: var(--muted-foreground) !important; }
.fx-cells { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12px; line-height: 16px; color: var(--ink); }
.fx-cells th, .fx-cells td { padding: 6px 8px; box-shadow: inset -1px -1px 0 color-mix(in oklch, var(--foreground) 9%, transparent); text-align: left; white-space: nowrap; }
.fx-cells th, .fx-cells td:first-child { background: color-mix(in oklch, var(--foreground) 4%, transparent); color: var(--ink-2); font-weight: 400; text-align: center; }
.fx-cells tr:nth-child(2) td:not(:first-child) { font-weight: 600; font-family: var(--font-sans); }

/* Motion 2: the agent mark breathes, very slowly, only while the agent is working */
.pf-agent .hm { animation: breathe 4.8s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: 0.35; } }
.still .pf-agent .hm, .rm .pf-agent .hm { animation: none; }

/* Face content, laid out on a 320 x 240 page. The block's own caption is quiet so the plan's title leads. */
.fp { padding: 22px 24px; font-size: 13px; line-height: 19px; }
.fcap { font-size: 11px; line-height: 14px; font-weight: 500; color: var(--ink-2); margin-bottom: 10px; }
.fh { font-size: 17px; line-height: 22px; font-weight: 600; margin-bottom: 10px; }
.fp p { margin: 0 0 8px; color: var(--ink-2); font-size: 12.5px; line-height: 18px; }
.ft { width: 100%; border-collapse: collapse; font-size: 12px; line-height: 16px; }
.ft th { text-align: left; font-weight: 500; color: var(--ink-2); padding: 0 8px 6px 0; box-shadow: inset 0 -1px 0 var(--ink-3); }
.ft td { padding: 8px 8px 8px 0; box-shadow: inset 0 -1px 0 color-mix(in oklch, var(--foreground) 9%, transparent); }
.ft td:first-child { font-family: var(--font-mono); font-size: 11px; }
.fc { margin: 0; padding: 12px 14px; border-radius: 8px; background: color-mix(in oklch, var(--foreground) 5%, transparent); font-family: var(--font-mono); font-size: 12px; line-height: 17px; white-space: pre; color: var(--ink); }
.fl { margin: 0; padding-left: 20px; font-size: 13px; line-height: 19px; }
.fl li { margin-bottom: 7px; padding-left: 4px; }
.fl li::marker { color: var(--ink-2); font-family: var(--font-mono); font-size: 11px; }

.fx-svg { width: 100%; height: auto; display: block; }
.fx-svg .cap { font: 500 11px var(--font-sans); fill: var(--ink-2); }
.fx-svg .tk { font: 400 11px var(--font-mono); fill: var(--ink-2); }
.fx-svg .tk2 { font: 400 11px var(--font-sans); fill: var(--ink-2); text-anchor: middle; }
.fx-svg .ax { stroke: var(--ink-3); stroke-width: 1; }
.fx-svg .bx { fill: color-mix(in oklch, var(--foreground) 16%, transparent); }
.fx-svg .ln { fill: none; stroke: var(--ink); stroke-width: 1.75; stroke-linejoin: round; }
.fx-svg .lim { stroke: var(--ask); stroke-width: 1.25; stroke-dasharray: 5 4; }
.fx-svg .nd { fill: none; stroke: var(--ink-2); stroke-width: 1.25; }
.fx-svg .nd2 { fill: color-mix(in oklch, var(--foreground) 9%, transparent); stroke: var(--ink-2); stroke-width: 1.25; }
.fx-svg .nt { font: 500 11px var(--font-sans); fill: var(--ink); text-anchor: middle; }
.fx-svg .ar { fill: none; stroke: var(--ink-2); stroke-width: 1.25; }

.fx-co { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; padding: 18px 22px; height: 100%; font-size: 12px; }
.co-l { display: flex; flex-direction: column; gap: 5px; }
.co-l b, .co-r b { font-weight: 600; font-size: 12px; line-height: 16px; }
.co-l b:not(:first-child) { margin-top: 4px; }
.co-l i { display: block; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--ink-3); }
.co-l i.s { width: 60%; }
.co-l u { margin-top: 8px; display: grid; place-items: center; height: 22px; border-radius: 5px; background: var(--ink); color: var(--paper); text-decoration: none; font-size: 11px; font-weight: 600; }
.co-r { align-self: start; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 8px; background: color-mix(in oklch, var(--foreground) 5%, transparent); font-size: 11px; color: var(--ink-2); }
.co-r span { display: flex; justify-content: space-between; gap: 8px; }
.co-r em { white-space: nowrap; font-style: normal; font-family: var(--font-mono); color: var(--ink); }
.co-r .t { margin-top: 4px; padding-top: 8px; box-shadow: inset 0 1px 0 var(--ink-3); color: var(--ink); font-weight: 600; }
.co-r .t em { display: inline-block; }
/* Motion 1: the row the agent just wrote opens into the face, and is tinted for a moment where it landed */
.co-r .gc { display: grid; grid-template-rows: 0fr; margin-top: -8px; opacity: 0; transition: grid-template-rows 260ms var(--ease, ease-out), opacity 200ms ease-out 60ms; }
.co-r .gc > span { display: block; min-height: 0; overflow: hidden; }
.co-r .gc > span > span { margin: 8px -4px 0; padding: 1px 4px; border-radius: 4px; }
.co-r .gc.in { grid-template-rows: 1fr; opacity: 1; }
.co-r .gc.in > span > span { animation: landed 1600ms ease-out; }
@keyframes landed { from { background: color-mix(in oklch, var(--primary) 18%, transparent); } to { background: transparent; } }
.rm .co-r .gc { transition: none; }
.rm .co-r .gc.in > span > span { animation: none; }

.fx-map { padding: 22px 24px; }
.fx-map .mr { display: grid; grid-template-columns: 1fr 40px 1.3fr; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; }
.fx-map .mr span { padding: 5px 8px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--ink-3); }
.fx-map .mr .m { font-family: var(--font-mono); font-size: 11px; background: color-mix(in oklch, var(--foreground) 5%, transparent); box-shadow: none; }
.fx-map svg { width: 40px; height: 10px; fill: none; stroke: var(--ink-2); stroke-width: 1.25; }

.fx-sw { padding: 22px 24px; }
.fx-sw .sw { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 12px; }
.fx-sw .sw span { display: flex; flex-direction: column; gap: 5px; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-2); }
.fx-sw .sw i { display: block; aspect-ratio: 1.3; border-radius: 6px; box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent); }

/* The one shared-element move: the face grows into its block on the plan page. 280 ms, ease-out. */
::view-transition-group(hero) { animation-duration: 280ms; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
::view-transition-old(hero), ::view-transition-new(hero) { animation-duration: 280ms; height: 100%; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 180ms; }

/* STAND-IN for the existing, approved plan page: pages and artifacts on the left, the document, versions on the right */
.read { flex: 1; display: flex; flex-direction: column; overflow: auto; }
.rbar { display: flex; align-items: center; gap: 8px; height: 52px; flex: none; padding: 0 16px; }
.crumb { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px 0 6px; border-radius: 8px; font-size: 14px; color: var(--text-2); }
.crumb:hover { background: var(--step); }
.standin { margin-left: auto; padding: 2px 8px; border-radius: 6px; font-size: 12px; line-height: 18px; color: var(--muted-foreground); outline: 1px dashed color-mix(in oklch, var(--foreground) 22%, transparent); outline-offset: -1px; }
.rgrid { display: grid; grid-template-columns: 196px minmax(0, 1fr) 196px; column-gap: 40px; padding: 4px 16px 64px; }
.lrail, .vrail { font-size: 13px; line-height: 18px; color: var(--text-2); }
.lrail h4, .vrail h4 { margin: 14px 8px 6px; font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
.lrail h4:first-child, .vrail h4:first-child { margin-top: 4px; }
.lrail a { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; }
.lrail a .ic { width: 14px; height: 14px; }
.lrail a[aria-current] { background: var(--step); color: var(--foreground); }
.vrail ol { list-style: none; margin: 0; padding: 0; }
.vrail li { display: grid; gap: 1px; padding: 6px 8px; border-radius: 6px; }
.vrail li b { font-weight: 500; color: var(--foreground); }
.vrail li span { font-size: 12px; }
.vrail li[aria-current] { background: var(--step); }
.doc { max-width: 680px; width: 100%; justify-self: center; padding-top: 8px; }
.doc > .dd h1, .doc h1 { margin: 0 0 4px; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; }
.doc .meta { margin: 0 0 8px; font-size: 13px; color: var(--muted-foreground); }
.doc h2 { margin: 28px 0 6px; font-size: 15px; line-height: 24px; font-weight: 600; }
.doc p, .doc li { font-size: 15px; line-height: 26px; }
.doc p { margin: 0 0 12px; }
.doc ul { margin: 0; padding-left: 20px; }
.doc li { margin-bottom: 6px; }
/* On the plan page: a document's top is the hero target; a page, image or data file sits at reading size */
.dtop { display: block; }
.blk { position: relative; display: block; width: min(100%, 520px); aspect-ratio: 4 / 3; margin: 20px 0 8px; border-radius: 10px; overflow: hidden; background: var(--g); }
.blk :is(.win, .panel) { left: 6%; right: 6%; top: 7%; }
.blk .sheet.back { display: none; }

@media (max-width: 1100px) {
  .now, .rest { padding: 0 24px; }
  .hearth .hw { padding-left: 12px; }
  .rest { margin-top: 48px; }
  .rgrid { grid-template-columns: minmax(0, 1fr) 168px; column-gap: 32px; padding-left: 24px; }
  .lrail { display: none; }
}

/* Phone: one column, large faces, no sidebar */
@media (max-width: 640px) {
  .side { display: none; }
  .main { padding: 0; }
  .main > .pane { border-radius: 0; box-shadow: none; }
  .hearth { padding: 8px 16px 28px 8px; }
  .hearth .hw { padding: 20px 0 0 8px; flex-direction: column; align-items: flex-start; gap: 16px; }
  .hearth h1 { font-size: 24px; line-height: 30px; }
  .hearth.big h1 { font-size: 30px; line-height: 36px; }
  .now, .rest { padding: 0 16px; }
  .now-grid, .rest { grid-template-columns: minmax(0, 1fr); }
  .rest { margin-top: 40px; }
  .rgrid { display: block; padding: 0 16px 48px; }
  .vrail { display: none; }
  .standin { display: none; }
}
.mockbar { flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 32px); }
.mockbar .mplay > span { align-self: center; padding: 0 6px; color: var(--muted-foreground); }
.mockbar b { font-weight: 500; }
.hearth + .rest { margin-top: 24px; }
::view-transition-old(root) { animation: 120ms ease-out both vt-out; }
::view-transition-new(root) { animation: 200ms ease-out 60ms both vt-in; }
@keyframes vt-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; } }

/* The view switch: two small icon buttons in the hearth's top bar, right side; the pressed one has the pane's fill */
.htop { display: flex; align-items: center; justify-content: space-between; }
.vsw { display: flex; gap: 2px; padding: 2px; margin-right: -28px; border-radius: 9px; background: color-mix(in oklch, var(--foreground) 6%, var(--card)); }
.vsw button { display: grid; place-items: center; width: 28px; height: 24px; border-radius: 7px; color: var(--muted-foreground); }
.vsw button .ic { width: 15px; height: 15px; }
.vsw button:hover { color: var(--foreground); }
.vsw button[aria-pressed="true"] { background: var(--card); color: var(--foreground); box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 8%, transparent), 0 1px 2px color-mix(in oklch, var(--shadow-ink) 10%, transparent); }
.vsw button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

/* THE LIST. Same grouping, one row per plan, the Inbox list's row look: fills for hover and focus only. */
.list { padding: 8px 40px 64px; }
.lgroup { margin-bottom: 20px; }
.lgroup h3 { margin: 0 0 4px; padding: 0 8px; font-size: 13px; line-height: 28px; font-weight: 500; color: var(--text-2); }
.lr { display: grid; grid-template-columns: 36px minmax(0, 1fr) 160px 180px; align-items: center; column-gap: 14px; height: 44px; padding: 0 10px 0 6px; border-radius: 8px; outline: none; }
.lgroup:not(:first-child) .lr, .lr:not(:has(.lproj)) { grid-template-columns: 36px minmax(0, 1fr) 180px; }
.lr:hover { background: var(--hover); }
.lr:focus-visible { background: color-mix(in oklch, var(--primary) 12%, transparent); }
.lt.pv { width: 36px; height: 27px; aspect-ratio: auto; border-radius: 5px; box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--foreground) 7%, transparent); }
.lt .sheet { border-radius: 2px 2px 0 0; bottom: -2px; } .lt .sheet.back { display: none; } .lt .win, .lt .panel { border-radius: 2px; } .lt .wbar { height: 3px; padding: 0; } .lt .wbar i { display: none; } .lt .wbody { top: 3px; }
.lname { display: flex; align-items: center; min-width: 0; font-size: 14px; line-height: 20px; color: var(--foreground); }
.lname > span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.lproj { font-size: 13px; color: var(--muted-foreground); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.lfact { justify-content: flex-end; font-size: 13px; }
@media (max-width: 1100px) { .list { padding: 4px 16px 48px; } .vsw { margin-right: -12px; } }
@media (max-width: 640px) {
  .lr, .lgroup:not(:first-child) .lr, .lr:not(:has(.lproj)) { grid-template-columns: 36px minmax(0, 1fr) auto; height: 52px; }
  .lproj { display: none; }
  .list { padding: 0 8px 48px; }
  .vsw { margin-right: 0; }
}

<div id="app"></div>
<script>
/* Round four: Plans as a home. Made-up data. NOW is Monday, November 16, 2026, 3:30 PM. */
const Q = new URLSearchParams(location.search);
const THEME = Q.get('theme') || 'light';
const STATE = Q.get('state') || 'busy';
document.documentElement.classList.toggle('light', THEME === 'light');
if (Q.get('shot')) document.body.dataset.shot = '';
const go = (k, v) => { const q = new URLSearchParams(location.search); q.set(k, v); location.search = q.toString(); };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const NOW = new Date(2026, 10, 16, 15, 30);
const T = (d, h, m = 0) => new Date(2026, d >= 20 ? 9 : 10, d, h, m);
const sameDay = (a, b) => a.toDateString() === b.toDateString();

/* The still dither field from the first-run screen the owner liked (PlansGetStarted.tsx) */
function drawDither() {
  document.querySelectorAll('canvas.dither').forEach((c) => {
    const r = c.getBoundingClientRect(); const s = 3; const w = Math.ceil(r.width / s), h = Math.ceil(r.height / s);
    c.width = w; c.height = h; const x = c.getContext('2d');
    x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--muted-foreground').trim();
    x.globalAlpha = THEME === 'light' ? 0.22 : 0.26;
    const B = [0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26, 12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22, 3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25, 15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21];
    const blobs = JSON.parse(c.dataset.blobs || '[[0.18,0.2,0.22],[0.7,0.18,0.2],[0.88,0.62,0.26],[0.3,0.82,0.28],[0.55,0.95,0.2],[0.05,0.6,0.18]]');
    const k = +(c.dataset.k || 0.42);
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      let v = 0; for (const [bx, by, br] of blobs) { const dx = i / w - bx, dy = (j / h - by) * (h / w); v += Math.max(0, 1 - Math.hypot(dx, dy) / br); }
      v = Math.min(1, v * k); if (v * 64 > B[(j % 8) * 8 + (i % 8)]) x.fillRect(i, j, 1, 1);
    }
  });
}

      <button class="cpill" type="button"><span class="ags">${hostMark('Claude Code')}${hostMark('Codex')}${hostMark('OpenCode')}${hostMark('Pi')}</span>Copy prompt</button>
      <a class="nav" href="#">${ic('msg')}Feedback</a>
      <div class="setrow"><a class="nav" href="#">${ic('sliders')}Settings</a><button class="sq" type="button" aria-label="Keyboard shortcuts">${ic('keyboard')}</button><button class="sq" type="button" aria-label="Switch theme" onclick="go('theme','${THEME === 'light' ? 'dark' : 'light'}')">${ic(THEME === 'light' ? 'moon' : 'sun')}</button></div>
    </div>
  </aside><main class="main" id="main">${main}</main></div>${mockbar5()}`;
}

/* The mock bar: theme, state, each motion's play button, and reduced motion. Hidden in screenshots. */
function mockbar5() {
  const b = (k, v, label, cur) => `<button type="button" aria-pressed="${cur === v}" onclick="go('${k}','${v}')">${label}</button>`;
  const m = (fn, label) => `<button type="button" onclick="${fn}">${label}</button>`;
  return `<nav class="mockbar" aria-label="Mock controls">
    <div>${b('theme', 'light', 'Light', THEME)}${b('theme', 'dark', 'Dark', THEME)}</div>
    <div>${b('state', 'busy', 'Busy', STATE5)}${b('state', 'quiet', 'Quiet', STATE5)}${b('state', 'one', 'One', STATE5)}${b('state', 'none', 'None', STATE5)}${b('state', 'many', '48', STATE5)}${b('state', 'loading', 'Loading', STATE5)}${b('state', 'open', 'Open plan', STATE5)}</div>
    <div class="mplay"><span>Play</span>${m('play1()', '1 Agent writes')}${m('play2()', `2 Working mark: <b id="wk">${Q.get('still') ? 'off' : 'on'}</b>`)}${m('play3()', '3 New version')}${m('play4()', '4 Peek and press')}${m('play5()', '5 Field (cut)')}${m('play6()', '6 Draw in (cut)')}${m('playOpen()', 'Open a plan')}</div>
    <div>${b('rm', RM ? '0' : '1', RM ? 'Reduced motion: on' : 'Reduced motion: off', 'x')}</div></nav>`;
}

/* Cards or list: one small two-state switch, remembered per person (here in localStorage; in the product, a user setting) */
let VIEW = Q.get('view') || localStorage.getItem('plannotator.plans.view') || 'cards';
function setView(v) { VIEW = v; localStorage.setItem('plannotator.plans.view', v); const h = document.querySelector('.home'); const y = h ? h.scrollTop : 0; mount(homeHTML()); const h2 = document.querySelector('.home'); if (h2) h2.scrollTop = y; document.querySelector(`.vsw [data-v="${v}"]`)?.focus(); }
const viewSwitch = () => `<div class="vsw" role="group" aria-label="Show plans as">${[['cards', 'Cards', 'grid'], ['list', 'List', 'list']].map(([v, l, i]) => `<button type="button" data-v="${v}" aria-pressed="${VIEW === v}" aria-label="${l}" title="${l}" onclick="setView('${v}')">${ic(i)}</button>`).join('')}</div>`;

/* THE LIST ROW: a 28 px thumbnail of the same face on the same ground, the title (with the unread dot), the project,
   and the one fact or else the date at the right. Nothing else. The whole row is one link. */
function listRow(p, withProject) {
  const line = lineOf(p);
  const name = [p.name, line.text, p.unread && 'unread'].filter(Boolean).join(', ');
  return `<a class="lr" href="${hrefOf(p)}" data-id="${p.id}" aria-label="${esc(name)}" title="${esc(p.name)}">
    <span class="lt pv pv-${p.kind}" aria-hidden="true">${previewInner(p.kind, bodyOf(p)).replace(/ hero/g, '')}</span>
    <span class="lname">${p.unread ? '<i class="ud" aria-hidden="true"></i>' : ''}<span>${esc(p.name)}</span></span>
    ${withProject ? `<span class="lproj" aria-hidden="true">${p.project}</span>` : ''}
    <span class="pf pf-${line.k} lfact" aria-hidden="true">${line.html}</span></a>`;
}
const hearth = (big) => `<header class="hearth${big ? ' big' : ''}"><canvas class="dither" aria-hidden="true" data-k="${big ? 0.42 : 0.34}"></canvas>
  <div class="htop"><button class="btn-l tog" type="button" aria-label="Toggle sidebar">${ic('panel')}</button>${big ? '' : viewSwitch()}</div>
  <div class="hw"><h1>What do you want to plan?</h1>${big ? '<p>Plan in your agent as usual. Every plan you review is kept here as its own place, with each version, its files and your decision.</p>' : ''}<button class="btn btn-p" type="button">${ic('arrowR')}Start a plan</button></div></header>`;

function homeHTML() {
  if (!PLANS5.length) return `<section class="pane home first">${hearth(true)}</section>`;
  const now = PLANS5.filter(active);
  const rest = PLANS5.filter((p) => !active(p));
  const byProj = PROJ5.map((pj) => [pj, rest.filter((p) => p.project === pj)]).filter(([, l]) => l.length);
  const cap = Q.get('all') ? 99 : 4;
  const rows = byProj.map(([pj, l]) => `<div class="prow" data-n="${Math.min(l.length, cap)}"><h3><span>${pj}</span>${l.length > cap ? `<button class="morelink" type="button" onclick="go('all','1')">${l.length - cap} more</button>` : ''}</h3>${l.slice(0, cap).map((p) => planCard(p, 'md')).join('')}</div>`).join('');
  if (VIEW === 'list') {
    const groups = byProj.map(([pj, l]) => `<section class="lgroup" aria-label="${pj}"><h3>${pj}</h3>${l.map((p) => listRow(p, false)).join('')}</section>`).join('');
    return `<section class="pane home is-list">${hearth(false)}<div class="list">
      ${now.length ? `<section class="lgroup" aria-label="Now"><h3>Now</h3>${now.map((p) => listRow(p, true)).join('')}</section>` : ''}${groups}</div></section>`;
  }
  return `<section class="pane home">${hearth(false)}
    ${now.length ? `<section class="now" aria-label="Now"><h2>Now</h2><div class="grid now-grid" id="nowgrid">${now.map((p) => planCard(p, 'lg')).join('')}</div></section>` : ''}
    ${rows ? `<section class="rest" aria-label="Plans by project">${rows}</section>` : ''}</section>`;
}

/* STAND-IN for the existing, approved plan page (left rail with pages and artifacts, the document, versions on the
   right). It is not a redesign: it is only here so the move from card to page can be seen. The face's block sits in
   the document, and the face grows into it. */
const CONTEXT = {
  sessions: 'Sessions live in signed cookies today. That caps them at 4 KB and makes “sign out everywhere” impossible: a cookie we issued stays valid until it expires.',
  checkout: 'Checkout is three pages today, and a third of people leave between shipping and payment. One page, with the order summary always in view.',
  nightly: 'The ledger export runs as one job at midnight and times out on busy days. Split it into batches through the night.',
  rate: 'One noisy key can starve every other customer. Limit each key, not each account.',
};
function readHTML(id) {
  const p = ALL.find((x) => x.id === id) || ALL[0];
  const n = p.versions;
  const vers = Array.from({ length: n }, (_, i) => n - i).map((v, i) => `<li${i === 0 ? ' aria-current="true"' : ''}><b>v${v}</b><span>${i === 0 ? (p.mine ? 'Your move' : p.live ? `${esc(p.host)} is writing` : 'Approved') : 'Changes asked'}</span></li>`).join('');
  const approach = id === 'sessions'
    ? `<h2>Approach</h2><ul><li>Store each session in Redis, keyed by an opaque id the cookie carries.</li><li>Expire sessions after 14 days without a request; each request pushes the expiry out.</li><li>Release 1 reads both stores and writes only Redis. Release 2 stops reading cookie payloads.</li></ul>`
    : `<h2>Approach</h2><ul><li>Change one thing at a time, behind a flag.</li><li>Keep the old path for one release.</li></ul>`;
  /* The card's preview grows into its own place here: a document into the top of the document, a page, image or data
     file into that file at reading size. */
  const top = p.kind === 'doc' || p.kind === 'none'
    ? `<div class="dtop" id="blk">${p.kind === 'doc' ? docBody(p).replace('<span class="dd">', '<div class="dd">').replace(/<\/span>$/, '</div>') : `<div class="dd"><h1>${esc(p.name)}</h1><p class="nothing">Nothing written yet.</p></div>`}</div>`
    : `<div class="dd"><h1>${esc(p.name)}</h1><h2>Context</h2><p>${CONTEXT[id] || 'What changes, and why now. The plan keeps the old path for one release.'}</p></div><figure class="blk pv-${p.kind}" id="blk">${previewInner(p.kind, p.body).replace(' hero', '')}</figure>`;
  return `<section class="pane read">
    <div class="rbar"><a class="crumb" href="?${new URLSearchParams({ theme: THEME, ...(RM ? { rm: '1' } : {}) })}" onclick="return back(event)">${ic('chevL')}Plans</a><span class="standin">Stand-in for the existing plan page</span></div>
    <div class="rgrid">
      <nav class="lrail" aria-label="Pages"><h4>Pages</h4><a aria-current="page">Plan</a><a>Rollout</a><a>Risks</a><h4>Artifacts</h4><a>${ic('file')}${p.file || `${p.id}-plan.md`}</a></nav>
      <article class="doc"><p class="meta">${p.project}</p>${top}${approach}</article>
      <aside class="vrail" aria-label="Versions"><h4>Versions</h4><ol>${vers}</ol></aside>
    </div></section>`;
}

/* Rendering, and the one shared-element move: card face grows into the block in the page, 280 ms, ease-out.
   Reduced motion: a plain cut. */
let homeScroll = 0;
function mount(html) { document.getElementById('main').innerHTML = html; fit(); drawDither(); }
function withMove(update) {
  if (RM || !document.startViewTransition) { update(); return Promise.resolve(); }
  return document.startViewTransition(update).finished;
}
function openPlan(id, faceEl) {
  homeScroll = document.querySelector('.home')?.scrollTop || 0;
  if (faceEl) faceEl.style.viewTransitionName = 'hero';
  const q = new URLSearchParams(location.search); q.set('state', 'open'); q.set('plan', id); history.pushState({ id }, '', '?' + q);
  return withMove(() => { mount(readHTML(id)); const b = document.getElementById('blk'); if (b) b.style.viewTransitionName = 'hero'; });
}
function back(e) {
  if (e) e.preventDefault();
  const id = new URLSearchParams(location.search).get('plan') || 'sessions';
  const q = new URLSearchParams(location.search); q.set('state', ORIGIN); q.delete('plan'); history.pushState({}, '', '?' + q);
  return withMove(() => {
    mount(homeHTML()); const h = document.querySelector('.home'); if (h) h.scrollTop = homeScroll;
    const f = document.querySelector(`.pc[data-id="${id}"] .hero, .lr[data-id="${id}"] .lt`); if (f) f.style.viewTransitionName = 'hero';
  }).then(() => document.querySelectorAll('[style*="view-transition-name"]').forEach((x) => (x.style.viewTransitionName = '')));
}
const ORIGIN = STATE5 === 'open' ? 'busy' : STATE5;
document.addEventListener('click', (e) => {
  const a = e.target.closest('.pc, .lr'); if (!a || e.metaKey || e.ctrlKey) return;
  e.preventDefault(); openPlan(a.dataset.id, a.querySelector('.hero, .lt'));
});

/* ---------- Motion 1: the agent writes, and the change lands in the face. Still between writes. ---------- */
const cardOf = (id) => document.querySelector(`.pc[data-id="${id}"]`);
function play1() {
  const co = cardOf('checkout');
  if (co) {
    const gc = co.querySelector('.gc'), tot = co.querySelector('.tot');
    gc.classList.add('in');
    const pay = co.querySelector('.pay');
    const swap = () => { tot.textContent = '$76.40'; pay.textContent = 'Pay $76.40'; };
    if (RM) swap();
    else setTimeout(() => { [tot, pay].forEach((el) => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, easing: 'ease-out' })); swap(); }, 120);
  }
  setTimeout(() => {
    const r = cardOf('rate'); if (!r) return;
    const svg = r.querySelector('svg.fx-svg'), old = svg.querySelector('.ln');
    const nl = old.cloneNode(); nl.setAttribute('points', '16,190 40,184 60,176 72,120 84,112 96,180 130,174 150,168 162,118 174,110 186,176 230,170 250,160 262,122 274,112 286,172 304,168');
    svg.appendChild(nl);
    if (RM) { old.remove(); return; }
    const L = nl.getTotalLength(); nl.style.strokeDasharray = L; nl.style.strokeDashoffset = L;
    nl.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 640, easing: EASE, fill: 'forwards' });
    old.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, easing: 'ease-out', fill: 'forwards' }).finished.then(() => old.remove());
  }, RM ? 0 : 900);
}

/* ---------- Motion 2: the agent mark breathes very slowly while the agent is working; stops when it is not. ---------- */
function play2() { const off = document.body.classList.toggle('still'); document.getElementById('wk').textContent = off ? 'off' : 'on'; }
if (Q.get('still')) document.body.classList.add('still');

/* ---------- Motion 3: a new version arrives. One soft settle, the sheets step out by one, "Now" re-sorts (FLIP). ---------- */
function play3() {
  const grid = document.getElementById('nowgrid'), c = cardOf('rate'); if (!grid || !c) return;
  const cards = [...grid.children], first = new Map(cards.map((el) => [el, el.getBoundingClientRect()]));
  const h = c.querySelector('.hero');
  c.querySelector('.pf').outerHTML = '<span class="pf pf-you" aria-hidden="true">Your move</span>';
  const t = c.querySelector('.pt'); if (!t.querySelector('.ud')) t.insertAdjacentHTML('afterbegin', '<i class="ud" aria-hidden="true"></i>');
  c.setAttribute('aria-label', 'Rate limits per API key, your move, unread');
  grid.prepend(c);
  if (RM) return;
  for (const el of cards) {
    const a = first.get(el), b = el.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (el === c) { el.animate([{ transform: `translate(${dx}px, ${dy - 4}px)` }, { transform: 'none' }], { duration: 320, easing: EASE }); if (h) h.animate([{ transform: 'translateY(8px)', opacity: 0.6 }, { transform: 'none', opacity: 1 }], { duration: 320, easing: EASE }); }
    else if (dx || dy) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 320, easing: EASE });
  }
}

/* ---------- Motion 4: hover or focus peeks at the sheets; press presses in a hair. Played here on the first card. ---------- */
function play4() {
  const c = document.querySelector('.now .pc') || document.querySelector('.pc'); if (!c) return;
  c.classList.add('peek'); setTimeout(() => c.classList.add('press'), 900); setTimeout(() => c.classList.remove('press'), 1060); setTimeout(() => c.classList.remove('peek'), 1700);
}

/* ---------- Motion 5 (cut): the dither field drifts and gathers toward the pointer, then goes still. ---------- */
let fieldUntil = 0, fieldRun = false, ptr = null;
function play5() { if (RM) return; fieldUntil = performance.now() + 8000; if (!fieldRun) { fieldRun = true; requestAnimationFrame(fieldTick); } }
let lastDraw = 0;
function fieldTick(t) {
  const c = document.querySelector('canvas.dither');
  if (!c || t > fieldUntil) { fieldRun = false; return; }
  if (t - lastDraw > 66) {
    lastDraw = t; const k = t / 1000;
    const base = [[0.18, 0.2, 0.22], [0.7, 0.18, 0.2], [0.88, 0.62, 0.26], [0.3, 0.82, 0.28], [0.55, 0.95, 0.2], [0.05, 0.6, 0.18]];
    const bl = base.map(([x, y, r], i) => [x + 0.03 * Math.sin(k * 0.35 + i), y + 0.05 * Math.cos(k * 0.3 + i * 1.7), r]);
    if (ptr) bl.push([ptr[0], ptr[1], 0.12]);
    c.dataset.blobs = JSON.stringify(bl); drawDither();
  }
  requestAnimationFrame(fieldTick);
}
document.addEventListener('pointermove', (e) => {
  const c = document.querySelector('canvas.dither'); if (!c || !fieldRun) return;
  const r = c.getBoundingClientRect(); ptr = [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
  fieldUntil = Math.max(fieldUntil, performance.now() + 3000);
});

/* ---------- Motion 6 (cut): faces draw in once, staggered, on arrival. ---------- */
function play6() {
  if (RM) return;
  document.querySelectorAll('.pc .pv').forEach((f, i) => f.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 260, delay: Math.min(i, 12) * 30, easing: EASE, fill: 'backwards' }));
}
function playOpen() { const c = document.querySelector('.now .pc') || document.querySelector('.pc'); if (c) openPlan(c.dataset.id, c.querySelector('.hero')); else if (STATE5 === 'open') back(); }

function fit() {
  document.querySelectorAll('.pin').forEach((el) => { const box = el.parentElement; el.style.setProperty('--s', box.clientWidth / +el.dataset.w); });
  const rest = document.querySelector('.rest'); if (!rest) return;
  const cols = getComputedStyle(rest).gridTemplateColumns.split(' ').length;
  rest.querySelectorAll('.prow').forEach((r) => (r.style.gridColumn = `span ${Math.min(+r.dataset.n, cols)}`));
}
document.getElementById('app').innerHTML = shell5(STATE5 === 'open' ? readHTML(Q.get('plan') || 'sessions') : homeHTML());
fit(); new ResizeObserver(fit).observe(document.body);
drawDither();
addEventListener('popstate', () => location.reload());

</script>
</body>
</html>
