<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variant A · Solid tile · generated agent icons</title>
<style>
/* Tokens: Plannotator's default theme (packages/ui/themes/plannotator.css), dark then light. */
:root, .dark {
  --background: oklch(0.15 0.02 260); --foreground: oklch(0.90 0.01 260); --card: oklch(0.22 0.02 260);
  --popover: oklch(0.28 0.025 260); --primary: oklch(0.75 0.18 280); --muted: oklch(0.26 0.02 260);
  --muted-foreground: oklch(0.72 0.02 260); --accent: oklch(0.70 0.20 60); --border: oklch(0.35 0.02 260);
  --ring: oklch(0.75 0.18 280); --host-ink: #f2f2f2; --host-paper: #1b1b1b;
}
.light {
  --background: oklch(0.97 0.005 260); --foreground: oklch(0.18 0.02 260); --card: oklch(1 0 0);
  --popover: oklch(1 0 0); --primary: oklch(0.50 0.25 280); --muted: oklch(0.92 0.01 260);
  --muted-foreground: oklch(0.40 0.02 260); --accent: oklch(0.60 0.22 50); --border: oklch(0.88 0.01 260);
  --ring: oklch(0.50 0.25 280); --host-ink: #1b1b1b; --host-paper: #ffffff;
}
.t-gruvbox { --background:#282828; --foreground:#ebdbb2; --card:#3c3836; --primary:#458588; --muted:#504945; --border:#504945; }
.t-gruvbox.light { --background:#fbf1c7; --foreground:#3c3836; --card:#f2e5bc; --primary:#076678; --muted:#ebdbb2; --border:#d5c4a1; }
.t-github { --background:#24292e; --foreground:#e1e4e8; --card:#1f2428; --primary:#58a6ff; --muted:#2f363d; --border:#1b1f23; }
.t-github.light { --background:#ffffff; --foreground:#24292e; --card:#f6f8fa; --primary:#0366d6; --muted:#fafbfc; --border:#e1e4e8; }
.t-catppuccin { --background:#1e1e2e; --foreground:#cdd6f4; --card:#313244; --primary:#89b4fa; --muted:#45475a; --border:#585b70; }
.t-catppuccin.light { --background:#eff1f5; --foreground:#4c4f69; --card:#e6e9ef; --primary:#1e66f5; --muted:#ccd0da; --border:#acb0be; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font: 13px/1.4 'Inter Variable', Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
.page { width: 1440px; padding: 28px 32px 40px; }
h1 { font-size: 20px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
.lede { color: var(--muted-foreground); margin: 0 0 18px; max-width: 980px; font-size: 13.5px; }
.note { color: var(--muted-foreground); font-size: 12px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
.mode { font: inherit; color: var(--foreground); background: var(--muted); border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }

/* ── the generated icon ── */
.g { --rot: 0; --hc: oklch(from var(--primary) 0.62 0.14 calc(h + var(--rot)));
  position: relative; display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: var(--s); height: var(--s); border-radius: calc(var(--s) * 0.28); user-select: none; line-height: 1; }
.g[data-hue="1"] { --rot: 45; } .g[data-hue="2"] { --rot: 90; } .g[data-hue="3"] { --rot: 135; }
.g[data-hue="4"] { --rot: 180; } .g[data-hue="5"] { --rot: 225; } .g[data-hue="6"] { --rot: 270; } .g[data-hue="7"] { --rot: 315; }
.g > b { font-weight: 680; letter-spacing: -0.03em; font-size: calc(var(--s) * 0.44); }
.g[data-n="1"] > b { font-size: calc(var(--s) * 0.54); }
.g[data-kind="emoji"] > b { font-size: calc(var(--s) * 0.6); letter-spacing: 0; }
/* A: solid squircle, the hue itself, letters in the page's lightest */
.g-A { background: oklch(from var(--hc) 0.53 0.135 h); color: oklch(0.985 0.005 260); }
/* B: soft round monogram in mono, a tint of the hue, letters the hue toward the text colour */
.g-B { border-radius: 50%; background: color-mix(in oklab, var(--hc) 24%, var(--background)); color: color-mix(in oklab, var(--hc) 62%, var(--foreground)); }
.g-B > b { font-family: 'Geist Mono Variable', 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; letter-spacing: -0.06em; font-size: calc(var(--s) * 0.47); }
.g-B[data-n="1"] > b { font-size: calc(var(--s) * 0.56); }
/* C: dither field tied to the name, letters knocked out of it */
.g-C { overflow: hidden; --g-paper: color-mix(in oklab, var(--hc) 16%, var(--background)); --g-ink: color-mix(in oklab, var(--hc) 78%, var(--background)); }
.g-C > svg { width: 100%; height: 100%; display: block; border-radius: inherit; }
.g-C .g-dt { fill: color-mix(in oklab, var(--hc) 30%, var(--foreground)); font-family: 'Inter Variable', Inter, system-ui, sans-serif; letter-spacing: -2px; }
.g-none { background: var(--muted); }
.g-none > svg { width: 70%; height: 70%; }
.g-badge { position: absolute; right: calc(var(--b) * -0.22); bottom: calc(var(--b) * -0.22); width: var(--b); height: var(--b); border-radius: 50%; box-shadow: 0 0 0 1.5px var(--ring-bg, var(--background)); display: block; }
.g-badge > svg, .g-host > svg { width: 100%; height: 100%; display: block; }
.g-host { display: inline-flex; width: var(--s); height: var(--s); flex: none; }

/* ── window ── */
.stage { display: grid; grid-template-columns: 1072px 1fr; gap: 24px; align-items: start; }
.win { position: relative; height: 700px; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 248px 400px 1fr; background: var(--background); box-shadow: 0 0 0 1px var(--border), 0 18px 50px rgba(0,0,0,.18); }
.side { --ring-bg: var(--ground); --ground: color-mix(in oklch, var(--background) 92%, var(--foreground) 3%); background: var(--ground); padding: 14px 10px; border-right: 1px solid color-mix(in oklch, var(--border) 70%, transparent); }
.search { height: 32px; border-radius: 8px; background: var(--muted); display: flex; align-items: center; padding: 0 10px; color: var(--muted-foreground); gap: 8px; margin-bottom: 10px; }
.nav { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 8px; color: var(--foreground); }
.nav.on { background: var(--muted); font-weight: 550; }
.nav .ct { margin-left: auto; color: var(--muted-foreground); font-size: 12px; }
.ic { width: 16px; height: 16px; flex: none; color: var(--muted-foreground); }
.sec { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; margin-top: 12px; color: var(--muted-foreground); font-size: 12.5px; font-weight: 550; }
.sec .btns { margin-left: auto; display: flex; gap: 6px; }
.arow { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 8px; white-space: nowrap; overflow: hidden; }
.arow.sel { background: var(--muted); --ring-bg: var(--muted); }
.arow .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.prow { height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 8px; color: var(--foreground); border-radius: 8px; }
.prow .ct { margin-left: auto; color: var(--muted-foreground); font-size: 12px; }
.list { border-right: 1px solid color-mix(in oklch, var(--border) 70%, transparent); overflow: hidden; }
.lhead { height: 48px; display: flex; align-items: center; padding: 0 16px; font-weight: 650; font-size: 15px; }
.row { position: relative; padding: 10px 16px 11px 16px; margin: 0 6px; border-radius: 10px; }
.row.sel { background: var(--muted); --ring-bg: var(--muted); }
.l1 { display: flex; align-items: center; gap: 6px; height: 20px; }
.l1 .proj { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.l1 .tm { margin-left: auto; color: var(--muted-foreground); font-size: 12px; }
.tiles { display: inline-flex; }
.tiles > * + * { margin-left: -5px; }
.l2 { font-size: 13.5px; margin-top: 3px; }
.row.unread .l2 { font-weight: 600; }
.row.unread .proj { font-weight: 550; }
.l3 { color: var(--muted-foreground); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread { padding: 0; overflow: hidden; }
.thead { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 20px; font-weight: 600; font-size: 14.5px; border-bottom: 1px solid color-mix(in oklch, var(--border) 60%, transparent); }
.tmeta { display: flex; align-items: center; gap: 8px; padding: 12px 20px 4px; color: var(--muted-foreground); font-size: 12.5px; }
.pile { display: inline-flex; } .pile > * + * { margin-left: -4px; }
.msg { padding: 14px 20px; }
.mfrom { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.mfrom .who { font-weight: 400; color: var(--muted-foreground); font-size: 12.5px; }
.mbody { margin: 8px 0 0 34px; color: color-mix(in oklch, var(--foreground) 88%, var(--background)); font-size: 13.5px; line-height: 1.55; }
.mbody p { margin: 0 0 8px; }

/* ── the dial (FaceFan) ── */
.dial { position: absolute; pointer-events: none; }
.plate { position: absolute; border-radius: 0 999px 999px 0; background: var(--popover); box-shadow: 0 0 0 1px color-mix(in oklch, var(--border) 80%, transparent), 0 16px 40px rgba(0,0,0,.28); }
.hub { position: absolute; width: 48px; height: 48px; border-radius: 50%; background: var(--background); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px color-mix(in oklch, var(--border) 80%, transparent); --ring-bg: var(--background); }
.spot { position: absolute; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; --ring-bg: var(--popover); }
.spot.chosen::after { content: ''; position: absolute; inset: -4px; border-radius: 10px; box-shadow: 0 0 0 2px var(--ring); }
.spot.chosen.round::after { border-radius: 50%; }
.f-tile { width: 28px; height: 28px; border-radius: 8px; display: block; } .f-tile > svg { width: 100%; height: 100%; display: block; }
.f-bare { width: 28px; height: 28px; display: block; } .f-bare > svg { width: 100%; height: 100%; }
.f-own { width: 28px; height: 28px; color: var(--muted-foreground); display: block; } .f-own > svg { width: 100%; height: 100%; }
.tip { position: absolute; background: var(--foreground); color: var(--background); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
.dot { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--muted-foreground); }

/* ── side cards ── */
.card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 0 0 1px color-mix(in oklch, var(--border) 60%, transparent); --ring-bg: var(--card); }
.card + .card { margin-top: 16px; }
.sizes { display: grid; grid-template-columns: 70px repeat(2, 1fr); row-gap: 10px; align-items: center; }
.sizes .lbl { color: var(--muted-foreground); font-size: 12px; }
.sizes .cell { display: flex; align-items: center; gap: 10px; }
.same { display: grid; gap: 8px; }
.same .arow { padding: 0; }

/* ── hard names ── */
.hard { margin-top: 28px; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 500; color: var(--muted-foreground); font-size: 12px; padding: 0 12px 8px 0; }

.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

/* ── themes ── */
.themes { margin-top: 28px; display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; }

.th .tn { font-size: 11.5px; color: color-mix(in oklch, var(--foreground) 65%, var(--background)); margin-bottom: 8px; }
.th .ts { display: flex; flex-wrap: wrap; gap: 6px; }
</style>
</head>
<body>
<div class="page" id="page"></div>
<script>
const VARIANT = 'A';
// Generated agent icons: the letters, the hue, the pattern, and the three looks. Mock code, not product code.
const SEG = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
const LETTER = /^[\p{L}\p{N}]/u;
const PAIRS = /^[\p{Script=Latin}\p{Script=Greek}\p{Script=Cyrillic}\p{Script=Armenian}\p{Script=Georgian}\p{N}]/u;
const PICTO = /\p{Extended_Pictographic}|\p{Regional_Indicator}/u;
const graphemes = (s) => Array.from(SEG.segment(s), (x) => x.segment);

/** The label as the Inbox shows it: "api · work" when two folders share a name. Letters from the base, colour from the whole. */
function splitLabel(label) {
  const s = label.normalize('NFC').trim().replace(/\s+/g, ' ');
  const i = s.indexOf(' · ');
  return { base: i < 0 ? s : s.slice(0, i), seed: s.toLocaleLowerCase('en-US') };
}

/** Words: drop an npm scope, split camel humps, split on anything that is not a letter, digit or mark. */
function wordsOf(base) {
  let b = base.replace(/^@[^/\s]+\//, '');
  b = b.replace(/(\p{Ll})(\p{Lu})/gu, '$1 $2').replace(/(\p{Lu})(\p{Lu}\p{Ll})/gu, '$1 $2');
  return b.split(/[^\p{L}\p{N}\p{M}]+/u).filter(Boolean);
}

/** Proposed rule: two or more words, the first letter of the first and of the last; one word, its first letter and its first digit, else its last letter. */
function genLetters(label) {
  const { base } = splitLabel(label);
  const ws = wordsOf(base).map((w) => graphemes(w).filter((g) => LETTER.test(g))).filter((w) => w.length);
  if (!ws.length) {
    const emoji = graphemes(base).find((g) => PICTO.test(g));
    return emoji ? { text: emoji, n: 1, kind: 'emoji' } : { text: '', n: 0, kind: 'none' };
  }
  const first = ws[0][0];
  let second = null;
  if (ws.length > 1) second = ws[ws.length - 1][0];
  else {
    const w = ws[0];
    second = w.slice(1).find((g) => /\p{N}/u.test(g)) ?? (w.length > 1 ? w[w.length - 1] : null);
  }
  if (!second || !PAIRS.test(first) || !PAIRS.test(second)) return { text: first.toLocaleUpperCase(), n: 1, kind: 'letters' };
  return { text: (first + second).toLocaleUpperCase(), n: 2, kind: 'letters' };
}

/** Today's letter-mark rule (letterMarks.tsx markLetters), for the comparison column: first and last letter of the whole name. */
function todayLetters(name) {
  const parts = graphemes(name.normalize('NFC').trim());
  const letters = parts.filter((g) => LETTER.test(g));
  if (!letters.length) {
    const e = parts.find((g) => PICTO.test(g));
    return e ? e : '·';
  }
  const f = letters[0], l = letters[letters.length - 1];
  if (letters.length === 1 || !PAIRS.test(f) || !PAIRS.test(l)) return f.toLocaleUpperCase();
  return (f + l).toLocaleUpperCase();
}

/** 32-bit FNV-1a with a final mix (the same family as letterMarks.tsx hueOf), over UTF-16 units. */
function h32(seed) {
  let h = 0x811c9dc5;
  for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return h >>> 0;
}
const HUES = 8;
const baseHue = (label) => h32(splitLabel(label).seed) % HUES;

/**
 * On-screen tie-break: projects that would draw the same letters in the same hue. Sorted by their seed (the same
 * order on every machine that has both), the first keeps its hue, each next one steps 3 hues (135°) until free.
 */
function hueTable(labels) {
  const out = new Map();
  const groups = new Map();
  for (const l of new Set(labels)) {
    const k = genLetters(l).text;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(l);
  }
  for (const group of groups.values()) {
    group.sort((a, b) => (splitLabel(a).seed < splitLabel(b).seed ? -1 : 1));
    const taken = new Set();
    for (const l of group) {
      let hue = baseHue(l);
      for (let step = 0; step < HUES && taken.has(hue); step++) hue = (hue + 3) % HUES;
      taken.add(hue);
      out.set(l, hue);
    }
  }
  return out;
}

// ── host marks: stand-ins drawn for the mock, NOT the real agent logos ──
const HOSTS = {
  claude: { name: 'Claude Code', svg: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#d9774f"/><g stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M8 3.2v9.6M3.2 8h9.6M4.6 4.6l6.8 6.8M11.4 4.6l-6.8 6.8"/></g></svg>' },
  codex: { name: 'Codex', svg: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="var(--host-ink)"/><path d="M8 3.6l3.8 2.2v4.4L8 12.4 4.2 10.2V5.8z" fill="none" stroke="var(--host-paper)" stroke-width="1.5" stroke-linejoin="round"/></svg>' },
  pi: { name: 'Pi', svg: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="#2f6f5e"/><path d="M4.4 5.4h7.2M6.4 5.4v6M9.6 5.4v4.8c0 .7.4 1 1 1" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>' },
  opencode: { name: 'OpenCode', svg: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="var(--host-ink)"/><path d="M6.2 4.6H4.8v6.8h1.4M9.8 4.6h1.4v6.8H9.8" fill="none" stroke="var(--host-paper)" stroke-width="1.5"/></svg>' },
};

// ── the looks ──
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

function ditherSvg(label, hue, size, letters) {
  const h = h32('pattern:' + splitLabel(label).seed);
  const cells = size >= 36 ? 14 : size >= 26 ? 12 : 10;
  const cell = 100 / cells;
  const ang = ((h >>> 3) % 8) * (Math.PI / 4);
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const shape = (h >>> 9) % 3; // 0 linear, 1 radial from a corner, 2 band
  const lift = ((h >>> 12) % 3) * 0.08;
  let rects = '';
  for (let y = 0; y < cells; y++) for (let x = 0; x < cells; x++) {
    const u = (x + 0.5) / cells - 0.5, v = (y + 0.5) / cells - 0.5;
    let t;
    if (shape === 0) t = 0.5 + (u * dx + v * dy) * 1.25;
    else if (shape === 1) t = 1 - Math.hypot(u - dx * 0.5, v - dy * 0.5) * 1.15;
    else t = 1 - Math.abs(u * dx + v * dy) * 2.4;
    t = Math.min(0.92, Math.max(0.06, t * 0.86 + lift));
    if (BAYER[(y % 4) * 4 + (x % 4)] / 16 < t) rects += `<rect x="${(x * cell).toFixed(2)}" y="${(y * cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}"/>`;
  }
  const fs = letters.n === 2 ? 50 : letters.kind === 'emoji' ? 56 : 62;
  const stroke = size >= 30 ? 9 : 12;
  const txt = letters.text
    ? `<text x="50" y="${letters.kind === 'emoji' ? 70 : 69}" text-anchor="middle" font-size="${fs}" font-weight="760" class="g-dt" style="paint-order:stroke;stroke:var(--g-paper);stroke-width:${stroke};stroke-linejoin:round">${esc(letters.text)}</text>`
    : '';
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" fill="var(--g-paper)"/><g fill="var(--g-ink)">${rects}</g>${txt}</svg>`;
}

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

/**
 * One generated icon. `host` adds the agent's mark as a corner badge (from 20 px up). Variant: A solid squircle,
 * B soft round monogram, C dither field.
 */
function genIcon(label, size, { host = null, hue = null, variant = VARIANT } = {}) {
  const letters = genLetters(label);
  const hu = hue ?? baseHue(label);
  const badge = host && size >= 20 ? `<span class="g-badge" style="--b:${Math.round(size * (size >= 30 ? 0.42 : 0.5))}px">${HOSTS[host].svg}</span>` : '';
  if (letters.kind === 'none') return `<span class="g g-none" data-size="${size}" style="--s:${size}px">${host ? HOSTS[host].svg : ''}</span>`;
  let inner;
  if (variant === 'C') inner = ditherSvg(label, hu, size, letters);
  else inner = `<b>${esc(letters.text)}</b>`;
  return `<span class="g g-${variant}" data-hue="${hu}" data-n="${letters.n}" data-kind="${letters.kind}" style="--s:${size}px">${inner}${badge}</span>`;
}

/** A host's own mark at a size (what an agent shows today). */
function hostMark(host, size) {
  return `<span class="g-host" style="--s:${size}px">${HOSTS[host].svg}</span>`;
}

// ── the stand-in faces of the dial (Glass colours, Transparent, Face): simple drawings for the mock ──

function goggles(lens = '#f2a33a') {

function sidebar() {
  const agents = AGENTS.map((a, i) => `<div class="arow${a.sel ? ' sel' : ''}" data-agent="${i}">${icon(a.proj, 24, a.host)}<span class="nm">${esc(a.name)}</span></div>`).join('');

  return `<aside class="side">
    <div class="search">${I.search}<span>Search</span><span style="margin-left:auto;font-size:11.5px">⌘K</span></div>
    <div class="nav on">${I.inbox}<span>Inbox</span><span class="ct">6</span></div>
    <div class="nav">${I.board}<span>Board</span></div>
    <div class="sec">${I.gog}<span>Agents</span><span class="btns">${I.plus}${I.laptop}</span></div>

function listCol() {
  const rows = ROWS.map((r) => {
    // One tile per host, as today; each tile is the project's, with the host as its badge.
    const tiles = r.hosts.map((h) => icon(r.proj, 20, h)).join('');
    return `<div class="row${r.unread ? ' unread' : ''}${r.sel ? ' sel' : ''}">
      <div class="l1"><span class="tiles">${tiles}</span><span class="proj">${esc(r.proj)}</span><span class="tm">${r.tm}</span></div>
      <div class="l2">${esc(r.title)}</div>
      <div class="l3">${esc(r.pre)}</div></div>`;
  }).join('');
  return `<section class="list"><div class="lhead">Inbox</div>${rows}</section>`;
}

function threadCol() {
  return `<section class="thread">
    <div class="thead">Sync engine: two ways to split the queue</div>
    <div class="tmeta"><span class="pile">${icon('orchard', 20, 'codex')}${icon('orchard', 20, 'claude')}</span><span>2 sessions</span><span style="margin-left:auto">9:41 PM</span></div>
    <div class="msg"><div class="mfrom">${icon('orchard', 24, 'codex')}<span>Refactor sync engine</span><span class="who">Codex · orchard</span></div>
      <div class="mbody"><p>I split the queue two ways and ran both against last week's traffic.</p><p>Option A shares one retry budget. Option B keeps a budget per tenant, which stops one noisy tenant from starving the rest, at the cost of a second table.</p></div></div>
    <div class="msg"><div class="mfrom">${icon('orchard', 24, 'claude')}<span>Fix login redirect</span><span class="who">Claude Code · orchard</span></div>
      <div class="mbody"><p>B also fixes the redirect loop I hit on Tuesday: the auth worker shares that queue.</p></div></div>
  </section>`;
}

function dial(win) {
  // Open beside the selected agent row, as FaceFan does: a half disc to the right, kinds inside, Glass outside.
  const row = win.querySelector('.arow.sel');
  const mark = row.querySelector('.g, .g-host');
  const wr = win.getBoundingClientRect(), mr = mark.getBoundingClientRect();
  const cx = mr.left - wr.left + mr.width / 2, cy = mr.top - wr.top + mr.height / 2;
  const a = AGENTS.find((x) => x.sel);
  const kinds = [hostMark(a.host, 24), icon(a.proj, 28), FACE_TRANSPARENT, FACE_MASCOT, FACE_OWN, FACE_SETS];
  const R1 = 66, R2 = 108, reach = R2 + 14 + 20;
  const spots = (n, r, from, to) => Array.from({ length: n }, (_, i) => { const t = (from + (to - from) * (i / (n - 1))) * Math.PI / 180; return { x: Math.cos(t) * r, y: Math.sin(t) * r }; });
  const inner = spots(kinds.length, R1, -78, 78), outer = spots(GLASS.length, R2, -82, 82);
  let html = `<div class="plate" style="left:${cx}px;top:${cy - reach}px;width:${reach}px;height:${reach * 2}px"></div>`;
  html += `<div class="hub" style="left:${cx - 24}px;top:${cy - 24}px">${icon(a.proj, 30, a.host)}</div>`;
  kinds.forEach((k, i) => {
    const s = inner[i];
    html += `<div class="spot${i === 1 ? ' chosen' + (VARIANT === 'B' ? ' round' : '') : ''}" style="left:${cx + s.x - 14}px;top:${cy + s.y - 14}px">${k}</div>`;
  });
  outer.forEach((s, i) => { html += `<div class="spot" style="left:${cx + s.x - 14}px;top:${cy + s.y - 14}px">${glassTile(GLASS[i])}</div>`; });
  const s1 = inner[1];
  html += `<div class="tip" style="left:${cx + s1.x + 24}px;top:${cy + s1.y - 30}px">From the project name · orchard</div>`;
  const d = document.createElement('div');
  d.className = 'dial';
  d.style.cssText = 'left:0;top:0;width:100%;height:100%';
  d.innerHTML = html;
  win.appendChild(d);
}

function themes() {

}
