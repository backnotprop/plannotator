type: phase
displayName: Phase
displayNamePlural: Phases
icon: stepwise
color: '#8b5cf6'
modes:
  inline: true
  fullDocument: true
idPrefix: phs
fields:
- name: id
  type: string
  readOnly: true
  displayInline: false
- name: parents
  type: array
  itemType: string
  displayInline: false
- name: dependsOn
  type: array
  itemType: string
  displayInline: false
- name: title
  type: string
  required: true
- name: status
  type: select
  default: unstarted
  options:
  - value: unstarted
    label: Unstarted
    icon: circle
  - value: in-progress
    label: In Progress
    icon: motion_photos_on
  - value: done
    label: Done
    icon: check_circle
- name: description
  type: text
- name: progress
  type: number
  min: 0
  max: 100
- name: tags
  type: array
  itemType: string
  displayInline: false
inlineTemplate: '{icon} {title} {status}'
roles:
  title: title
  workflowStatus: status
  tags: tags
