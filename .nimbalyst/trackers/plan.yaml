type: plan
displayName: Plan
displayNamePlural: Plans
icon: edit_note
color: '#3b82f6'
modes:
  inline: true
  fullDocument: true
idPrefix: pln
idFormat: ulid
fields:
- name: id
  type: string
  readOnly: true
  displayInline: false
- name: parents
  type: array
  itemType: string
  displayInline: false
- name: dependsOn
  type: array
  itemType: string
  displayInline: false
- name: title
  type: string
  required: true
  displayInline: true
- name: status
  type: select
  required: true
  default: needs-approval
  options:
  - value: needs-approval
    label: Needs Approval
    icon: edit_note
    color: '#64748b'
  - value: approved
    label: Approved
    icon: check_circle
    color: '#22c55e'
  - value: in-progress
    label: In Progress
    icon: construction
    color: '#f59e0b'
  - value: complete
    label: Complete
    icon: task_alt
    color: '#10b981'
  - value: blocked
    label: Blocked
    icon: block
    color: '#dc2626'
- name: progress
  type: number
  min: 0
  max: 100
  default: 0
  displayInline: false
- name: tags
  type: array
  itemType: string
  displayInline: false
- name: tasks
  type: array
  itemType: string
  displayInline: false
statusBarLayout:
- row:
  - field: status
    width: 200
  - field: priority
    width: 150
  - field: progress
    width: 100
- row:
  - field: owner
    width: 200
  - field: tags
    width: auto
inlineTemplate: '{icon} {title} {status} {priority} {owner}'
tableView:
  defaultColumns:
  - title
  - status
  - priority
  - owner
  sortable: true
  filterable: true
  exportable: true
roles:
  title: title
  workflowStatus: status
  tags: tags
