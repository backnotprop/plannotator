type: automation
displayName: Automation
displayNamePlural: Automations
icon: auto_mode
color: '#60a5fa'
modes:
  inline: false
  fullDocument: true
creatable: false
sync:
  mode: local
  scope: project
idPrefix: AUTOMATION
idFormat: ulid
fields:
- name: id
  type: string
  readOnly: true
  displayInline: false
- name: parents
  type: array
  itemType: string
  displayInline: false
- name: dependsOn
  type: array
  itemType: string
  displayInline: false
- name: title
  type: string
  required: true
  displayInline: true
- name: status
  type: select
  default: new
  options:
  - value: active
    label: Active
    icon: play_circle
    color: '#22c55e'
  - value: failing
    label: Failing
    icon: error
    color: '#ef4444'
  - value: paused
    label: Paused
    icon: pause_circle
    color: '#64748b'
  - value: new
    label: New
    icon: fiber_new
    color: '#3b82f6'
- name: schedule
  type: string
  displayInline: true
  readOnly: true
- name: lastRun
  type: datetime
  displayInline: true
  readOnly: true
- name: runCount
  type: number
  displayInline: true
  readOnly: true
- name: tags
  type: array
  itemType: string
  displayInline: false
inlineTemplate: '{icon} {title} {status}'
roles:
  title: title
  workflowStatus: status
  tags: tags
