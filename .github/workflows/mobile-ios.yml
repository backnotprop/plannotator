name: Mobile iOS

# The native iPhone app (apps/mobile/), kept apart from the Inbox's CI. It
# starts only when a file under apps/mobile/ or this file changes, on GitHub's
# own macOS runners (never TEST_RUNNER or E2E_RUNNER), and it is never a
# required check: red here never blocks a pull request. No other workflow
# builds Swift, and scripts/ci-affected.ts leaves the native file kinds of
# apps/mobile/ios and apps/mobile/android out of the Test workflow's plan
# (nativeAppFile), so a pull request with only those runs no test lane and no
# Checks there.
#
# It starts for the iOS app (apps/mobile/ios), the contract's generated Swift
# (apps/mobile/contract/generated/swift), the parity ledger
# (apps/mobile/contract/parity/ledger.json), the ledger's clock
# (scripts/mobile/parity-debts.ts) and this file: not for Android files or the
# contract's other JSON data, which no step here reads.
#
# `ledger` (ubuntu, seconds, no install) runs the ledger's clock: a decision
# left `undecided`, or a debt the app `owed`, for more than 14 days fails it
# (docs/agent-guides/mobile.md). Only this workflow runs the clock: it is a
# script, not a test file, so no `bun test` (the Test workflow's lanes, main's
# full run, a release's checks) ever runs it. Red here holds back only the
# app's own release, never the Inbox's.
#
# Concurrency is per job, so the two kinds of run never cancel each other.
# `ios` runs in a group per branch: a new push cancels only the same pull
# request's (or main's) older run, never another pull request's. `ios-nightly`
# has its own group and never cancels or is cancelled, so a push during the
# nightly cannot stop it. At most one macOS job per branch, plus the nightly
# while it runs. A job whose `if` is false is skipped before it joins a group.
#
# The repository variable MOBILE_CI=nightly stops the per-push job (`ios`);
# the nightly and manual runs (`ios-nightly`) carry on. Any other value, or
# none, runs both.
#
# apps/mobile/ios/ci.sh does the work. It exits 0 while there is no Xcode
# project to build. The nightly runs the same steps as the pull request job
# until the app has a UI test suite.
#
# The runner image is pinned (macos-15), as the rest of the repository pins
# ubuntu-24.04: Xcode and Swift do not change under the job.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile/ios/**'
      - 'apps/mobile/contract/generated/swift/**'
      - 'apps/mobile/contract/parity/ledger.json'
      - 'scripts/mobile/parity-debts.ts'
      - '.github/workflows/mobile-ios.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/ios/**'
      - 'apps/mobile/contract/generated/swift/**'
      - 'apps/mobile/contract/parity/ledger.json'
      - 'scripts/mobile/parity-debts.ts'
      - '.github/workflows/mobile-ios.yml'
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS (build and swift test)
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && vars.MOBILE_CI != 'nightly' }}
    concurrency:
      group: mobile-ios-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test the app
        run: bash apps/mobile/ios/ci.sh pr

  ios-nightly:
    name: iOS nightly (same as the PR job until a UI suite exists)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: mobile-ios-nightly
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test the app
        run: bash apps/mobile/ios/ci.sh nightly

  ledger:
    name: The parity ledger's clock (no decision or debt older than 14 days)
    concurrency:
      group: mobile-ledger-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true

      - name: Check the ledger's dates
        run: bun scripts/mobile/parity-debts.ts
