name: Deploy

# Deploys after the Test workflow passes on a push to main: workflow_run starts
# this workflow when that Test run completes, so nothing waits on a runner.
# Only a Test run for a push to main in this repository can deploy. A PR run of
# Test (a fork's included, even from a branch named main) also completes and
# starts this workflow, but every job below skips it, so no code from a PR ever
# runs next to the deploy secrets.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] Gated to push runs on main of this repository; PR runs skip every job.
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - marketing
          - portal
          - paste
          - waitlist

permissions:
  contents: read

jobs:
  detect-changes:
    # A manual run deploys the commit it runs on; it still needs a passed Test
    # run there (checked below, no waiting).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.changes.outputs.sha }}
      marketing: ${{ steps.changes.outputs.marketing }}
      portal: ${{ steps.changes.outputs.portal }}
      paste: ${{ steps.changes.outputs.paste }}
      waitlist: ${{ steps.changes.outputs.waitlist }}
    steps:
      - name: Manual run needs a passed Test run on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          conclusion="$(gh api "repos/${REPOSITORY}/actions/workflows/test.yml/runs?head_sha=${COMMIT_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | sort_by(.created_at) | last | .conclusion // "missing"')"
          if [[ "$conclusion" != "success" ]]; then
            echo "The latest Test run on ${COMMIT_SHA} is ${conclusion}, not success. Run Test on this commit first." >&2
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # A workflow_run checks out the default branch's tip by default, which
          # may be newer than the commit Test passed on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Check for changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          CURRENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
            for site in marketing portal paste waitlist; do
              if [[ "$TARGET" == "all" || "$TARGET" == "$site" ]]; then
                echo "$site=true" >> "$GITHUB_OUTPUT"
              else
                echo "$site=false" >> "$GITHUB_OUTPUT"
              fi
            done
            exit 0
          fi

          # The passed Test runs of pushes to main, newest first (one call).
          RUNS="$(gh api "repos/${REPOSITORY}/actions/workflows/test.yml/runs?branch=main&event=push&status=success&per_page=50")"

          # What changed since the last push to main that passed Test. Every
          # push to main runs Test, so that is where the last deploy came
          # from; a push whose Test failed is deployed with the next one.
          BEFORE_SHA="$(jq -r "[.workflow_runs[] | select(.id < ${TEST_RUN_ID})] | first | .head_sha // empty" <<< "$RUNS")"
          if [[ -z "$BEFORE_SHA" ]] || ! git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
            BEFORE_SHA="${CURRENT_SHA}^1"
          fi

          # A newer main commit already passed Test (runs finish out of order,
          # or this one was rerun): deploy that newer tree instead of this
          # older one, which would overwrite it. It contains this commit, and
          # the diff from this run's base covers this commit's changes too.
          NEWEST_ID="$(jq -r '.workflow_runs[0].id // 0' <<< "$RUNS")"
          if (( NEWEST_ID > TEST_RUN_ID )); then
            CURRENT_SHA="$(jq -r '.workflow_runs[0].head_sha' <<< "$RUNS")"
            echo "Test run ${NEWEST_ID} passed on a newer main commit; deploying its tree ${CURRENT_SHA}."
            git fetch --no-tags --depth=1 origin "$CURRENT_SHA"
          fi
          echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "Changes ${BEFORE_SHA}..${CURRENT_SHA}"
          CHANGED="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"

          changed() { grep -Eq "$1" <<< "$CHANGED" && echo true || echo false; }
          {
            echo "marketing=$(changed '^(apps/marketing/|packages/)')"
            echo "portal=$(changed '^(apps/portal/|packages/)')"
            echo "paste=$(changed '^apps/paste-service/')"
            echo "waitlist=$(changed '^apps/waitlist-service/')"
          } >> "$GITHUB_OUTPUT"

  deploy-marketing:
    needs: detect-changes
    if: needs.detect-changes.outputs.marketing == 'true'
    # One deploy of a site at a time, queued and never cancelled, so two never
    # sync over each other. The group is on the deploy jobs, not the workflow:
    # a skipped Deploy run (a failed Test, a PR) must not replace a pending one.
    # A queued deploy of the same site from a newer commit can replace a pending
    # one; it ships the whole newer tree, which includes the older change.
    concurrency:
      group: deploy-marketing
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.detect-changes.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build marketing
        run: bun run build:marketing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: aws s3 sync apps/marketing/dist/ s3://plannotator-marketing/ --delete

      # The sync guesses text/markdown with no charset for .md; re-upload the
      # Inbox install prompt (/inbox/prompt.md) with an explicit charset.
      - name: Set the Inbox prompt's content type
        run: |
          if [ -f apps/marketing/dist/inbox/prompt.md ]; then
            aws s3 cp apps/marketing/dist/inbox/prompt.md s3://plannotator-marketing/inbox/prompt.md \
              --content-type "text/markdown; charset=utf-8"
          fi

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E284ON0A27O2H6 \
            --paths "/*"

  # NOTE: the /install.sh, /install.ps1, and /install.cmd paths on
  # plannotator.ai are served from the dedicated plannotator-install-scripts
  # bucket, NOT the marketing bucket. That bucket is deliberately NOT writable
  # by the CI deploy role, so there is no auto-sync job here: after any change
  # to scripts/install.*, sync BY HAND with local credentials (aws s3 cp each
  # script with its content-type, then a CloudFront invalidation for the three
  # paths on E284ON0A27O2H6) and verify the served md5s match the repo. See the
  # release runbook's post-release checklist for the exact commands.
  deploy-portal:
    needs: detect-changes
    if: needs.detect-changes.outputs.portal == 'true'
    concurrency:
      group: deploy-portal
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.detect-changes.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build portal
        run: bun run build:portal

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: aws s3 sync apps/portal/dist/ s3://plannotator-portal/ --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EP0KB9EFUWYXR \
            --paths "/*"

  deploy-paste:
    needs: detect-changes
    if: needs.detect-changes.outputs.paste == 'true'
    concurrency:
      group: deploy-paste
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.detect-changes.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Cloudflare
        working-directory: apps/paste-service
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-waitlist:
    needs: detect-changes
    if: needs.detect-changes.outputs.waitlist == 'true'
    concurrency:
      group: deploy-waitlist
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.detect-changes.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Cloudflare
        working-directory: apps/waitlist-service
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
