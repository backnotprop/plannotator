name: Inbox window e2e

# The Plannotator Inbox window, proved in a real browser: headless Chromium
# (Playwright, pinned in the root devDependencies) drives the COMPILED binary
# under a temp data dir while agents write through `plannotator inbox mcp`.
# The binary is built first, with the flags release.yml compiles with.
# tests/e2e/inbox.spec.ts (the window), notifications.spec.ts,
# inbox-guides.spec.ts (guided reviews), inbox-new-message.spec.ts (New
# message), inbox-order.spec.ts (newest first inside a section) and
# inbox-phones.spec.ts (pairing a phone) say what they prove;
# packages/server/inbox-devices.test.ts replays the phone door's contract
# exchanges on the same binary, and inbox-lan.test.ts proves the Wi-Fi
# listener there (a pinned phone over the runner's network address; no
# Bonjour on the runner, so the typed-address path); surface.spec.ts drives
# the surface a phone hosts (apps/hook/dist/surface.html) in WebKit, the
# engine WKWebView is, and the VS Code Guides webview's sanitizer and Mermaid
# path (vscode-guides-sanitize.spec.ts) and its answer frame
# (vscode-guides-answer.spec.ts), no binary needed. Runs only when the
# Inbox, the ui and the guide viewer it composes, the plan editor (the Grid
# paper spec, grid-paper-fill.spec.ts), the plan and annotate servers and the
# draft storage they share (annotate-*.spec.ts, plan-linked-doc-drafts.spec.ts),
# the binary entry or the build could have changed. The Pi servers are not
# listed: these specs drive only the compiled Bun binary, and test.yml runs the
# Pi mirrors of the same scenarios.
#
# The specs run as 8 parallel shards of whole spec files, balanced by
# measured time (scripts/ci-e2e-shard.ts, tests/e2e/shard-times.json).

on:
  # Manual runs on a branch, e.g. a stacked PR whose base is not main.
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/inbox/**'
      - 'apps/inbox/**'
      - 'packages/server/inbox*'
      - 'packages/server/ref-cards*'
      - 'packages/shared/ref-cards*'
