name: Inbox window e2e

# The Plannotator Inbox window, proved in a real browser: headless Chromium
# (Playwright, pinned in the root devDependencies) drives the COMPILED binary
# under a temp data dir while agents write through `plannotator inbox mcp`.
# The binary is built first, with the flags release.yml compiles with.
# tests/e2e/inbox.spec.ts (the window), notifications.spec.ts,
# inbox-guides.spec.ts (guided reviews), inbox-new-message.spec.ts (New
# message) and inbox-phones.spec.ts (pairing a phone) say what they prove;
# packages/server/inbox-devices.test.ts replays the phone door's contract
# exchanges on the same binary. Runs only when the
# Inbox, the ui and the guide viewer it composes, the binary entry or the build
# could have changed.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/inbox/**'
      - 'apps/inbox/**'
      - 'packages/server/inbox*'
      - 'packages/shared/inbox/**'
      - 'packages/core/inbox*'
      - 'packages/shared/config.ts'
      - 'packages/server/html-assets.ts'
      - 'packages/server/tailscale-serve.ts'
      - 'packages/server/request-host-guard.ts'
      - 'packages/shared/tailscale.ts'
      - 'packages/shared/html-assets.ts'
      - 'packages/shared/html-assets-node.ts'
      - 'packages/ui/**'
      - 'packages/guide-viewer/**'
      - 'packages/review-editor/**'
      - 'packages/server/guide/**'
      - 'packages/core/guide*'
      - 'apps/hook/server/index.ts'
      - 'apps/hook/server/inbox*'
      - 'build/**'
      - 'package.json'
      - 'bun.lock'
      - 'tests/e2e/**'
      - 'scripts/inbox-sim.ts'
      - '.github/workflows/inbox-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/inbox/**'
      - 'apps/inbox/**'
      - 'packages/server/inbox*'
      - 'packages/shared/inbox/**'
      - 'packages/core/inbox*'
      - 'packages/shared/config.ts'
      - 'packages/server/html-assets.ts'
      - 'packages/server/tailscale-serve.ts'
      - 'packages/server/request-host-guard.ts'
      - 'packages/shared/tailscale.ts'
      - 'packages/shared/html-assets.ts'
      - 'packages/shared/html-assets-node.ts'
      - 'packages/ui/**'
      - 'packages/guide-viewer/**'
      - 'packages/review-editor/**'
      - 'packages/server/guide/**'
      - 'packages/core/guide*'
      - 'apps/hook/server/index.ts'
      - 'apps/hook/server/inbox*'
      - 'build/**'
      - 'package.json'
      - 'bun.lock'
      - 'tests/e2e/**'
      - 'scripts/inbox-sim.ts'
      - '.github/workflows/inbox-e2e.yml'

permissions:
  contents: read

jobs:
  inbox-window-e2e:
    name: Inbox window (Playwright against the compiled binary)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Build the apps and compile the binary
        run: >-
          bun run build:review && bun run build:hook &&
          bun build apps/hook/server/index.ts --compile --no-compile-autoload-bunfig
          --define '__CLI_VERSION__="0.0.0-dev"' --outfile .local/plannotator

      - name: Run the Inbox window proof
        run: bun run test:e2e:inbox

      - name: Replay the phone door's contract exchanges on the binary
        run: |
          export PLANNOTATOR_DATA_DIR="$(mktemp -d)"
          PLANNOTATOR_INBOX_TEST_BINARY="$PWD/.local/plannotator" bun test packages/server/inbox-devices.test.ts

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inbox-window-proof
          path: .local/proof/
          if-no-files-found: ignore
