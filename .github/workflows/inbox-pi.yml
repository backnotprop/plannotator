name: Inbox Pi connection

# The Pi extension's connection to the Plannotator Inbox (plannotator_inbox
# and the reply wake), proved on the REAL Pi against the COMPILED binary under
# a temp data dir: apps/pi-extension/inbox.test.ts drives the installed Pi CLI
# in RPC mode with Pi's own RpcClient, the extension loaded from source, a
# scripted model endpoint, and the person's Send through the window's route.
# It runs once on the Pi the repo installs and once more for the floor
# (Pi 0.79.1, which has no agent_settled). apps/pi-extension/snapshots-live.test.ts
# proves the Snapshots link the same way against `plannotator snapshot hub`
# (one delivery of a Send, Ask as a turn). Runs only when the extension, the
# Inbox or Snapshots server, their stores or the connection contract could
# have changed.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/pi-extension/**'
      - 'packages/server/inbox*'
      - 'packages/shared/inbox/**'
      - 'packages/core/inbox*'
      - 'packages/shared/config.ts'
      - 'apps/hook/server/index.ts'
      - 'apps/hook/server/inbox*'
      - 'packages/server/snapshots/**'
      - 'packages/shared/snapshots/**'
      - 'apps/hook/server/snapshot*'
      - 'tests/helpers/snapshots-*.ts'
      - 'packages/ai/session-bridge-pull*'
      - 'tests/helpers/inbox-world.ts'
      - 'tests/helpers/scripted-model.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/inbox-pi.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/pi-extension/**'
      - 'packages/server/inbox*'
      - 'packages/shared/inbox/**'
      - 'packages/core/inbox*'
      - 'packages/shared/config.ts'
      - 'apps/hook/server/index.ts'
      - 'apps/hook/server/inbox*'
      - 'packages/server/snapshots/**'
      - 'packages/shared/snapshots/**'
      - 'apps/hook/server/snapshot*'
      - 'tests/helpers/snapshots-*.ts'
      - 'packages/ai/session-bridge-pull*'
      - 'tests/helpers/inbox-world.ts'
      - 'tests/helpers/scripted-model.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/inbox-pi.yml'

permissions:
  contents: read

jobs:
  inbox-pi:
    name: Inbox Pi connection (the real Pi against the compiled binary)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Pi needs Node 22.19+ (its engines field).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Pi extension shared copies
        run: bash apps/pi-extension/vendor.sh

      - name: Build the apps and compile the binary
        run: >-
          bun run build:review && bun run build:hook &&
          bun build apps/hook/server/index.ts --compile --no-compile-autoload-bunfig
          --define '__CLI_VERSION__="0.0.0-dev"' --outfile .local/plannotator

      - name: Install the Pi floor (0.79.1, no agent_settled)
        # zizmor: ignore[adhoc-packages] The floor proof needs the exact
        # published Pi at the extension's peer floor. Owner: maintainers.
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/pi-floor" @earendil-works/pi-coding-agent@0.79.1

      - name: Run the connection proofs against the binary
        env:
          PLANNOTATOR_INBOX_TEST_BINARY: ${{ github.workspace }}/.local/plannotator
          INBOX_PROOF_DIR: ${{ github.workspace }}/.local/proof/inbox-pi
        run: |
          export PI_TEST_OLD_CLI="$RUNNER_TEMP/pi-floor/node_modules/@earendil-works/pi-coding-agent/dist/cli.js"
          export PLANNOTATOR_DATA_DIR="$(mktemp -d)"
          bun test apps/pi-extension/inbox.test.ts apps/pi-extension/snapshots-live.test.ts tests/parity/vendor-parity.test.ts

      - name: Keep the transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inbox-pi-proof
          path: .local/proof/
          if-no-files-found: ignore
