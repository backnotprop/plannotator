name: Inbox Pi connection

# The Pi extension's connection to the Plannotator Inbox (plannotator_inbox
# and the reply wake), proved on the REAL Pi against the COMPILED binary under
# a temp data dir: apps/pi-extension/inbox.test.ts drives the installed Pi CLI
# in RPC mode with Pi's own RpcClient, the extension loaded from source, a
# scripted model endpoint, and the person's Send through the window's route.
# It runs once on the Pi the repo installs and once more for the floor
# (Pi 0.79.1, which has no agent_settled). Runs only when the extension, the
# Inbox server, its store or the connection contract could have changed.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/pi-extension/**'
      - 'packages/server/inbox*'
      - 'packages/shared/inbox/**'
      - 'packages/core/inbox*'
      - 'packages/shared/config.ts'
      - 'apps/hook/server/index.ts'
      - 'apps/hook/server/inbox*'
      - 'tests/helpers/inbox-world.ts'
      - 'tests/helpers/inbox-process.ts'
      - 'tests/helpers/real-data-dir.ts'
      - 'tests/helpers/hook-dist-stub.ts'
      - 'tests/setup/sandbox-data-dir.ts'
      - 'packages/shared/data-dir.ts'
      - 'tests/helpers/scripted-model.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/inbox-pi.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/pi-extension/**'
      - 'packages/server/inbox*'
      - 'packages/shared/inbox/**'
      - 'packages/core/inbox*'
      - 'packages/shared/config.ts'
      - 'apps/hook/server/index.ts'
      - 'apps/hook/server/inbox*'
      - 'tests/helpers/inbox-world.ts'
      - 'tests/helpers/inbox-process.ts'
      - 'tests/helpers/real-data-dir.ts'
      - 'tests/helpers/hook-dist-stub.ts'
      - 'tests/setup/sandbox-data-dir.ts'
      - 'packages/shared/data-dir.ts'
      - 'tests/helpers/scripted-model.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/inbox-pi.yml'

permissions:
  contents: read

# One run per PR, and one per main: a newer push cancels the older run (main
# included: only its newest commit needs the heavy suites). Adding any other
# label starts a run that skips every job; it gets a group of its own so it
# cannot cancel the real one.
concurrency:
  group: inbox-pi-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ci:full' && format('run-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  inbox-pi:
    name: Inbox Pi connection (the real Pi against the compiled binary)
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && (github.event.action != 'labeled' || github.event.label.name == 'ci:full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Pi needs Node 22.19+ (its engines field).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Pi extension shared copies
        run: bash apps/pi-extension/vendor.sh

      - name: Build the apps and compile the binary
        run: >-
          bun run build:review && bun run build:hook &&
          bun build apps/hook/server/index.ts --compile --no-compile-autoload-bunfig
          --define '__CLI_VERSION__="0.0.0-dev"' --outfile .local/plannotator

      - name: Install the Pi floor (0.79.1, no agent_settled)
        # zizmor: ignore[adhoc-packages] The floor proof needs the exact
        # published Pi at the extension's peer floor. Owner: maintainers.
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/pi-floor" @earendil-works/pi-coding-agent@0.79.1

      - name: Run the connection proofs against the binary
        env:
          PLANNOTATOR_INBOX_TEST_BINARY: ${{ github.workspace }}/.local/plannotator
          INBOX_PROOF_DIR: ${{ github.workspace }}/.local/proof/inbox-pi
        run: |
          export PI_TEST_OLD_CLI="$RUNNER_TEMP/pi-floor/node_modules/@earendil-works/pi-coding-agent/dist/cli.js"
          export PLANNOTATOR_DATA_DIR="$(mktemp -d)"
          bun test apps/pi-extension/inbox.test.ts tests/parity/vendor-parity.test.ts

      - name: Keep the transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inbox-pi-proof
          path: .local/proof/
          if-no-files-found: ignore

  # The merge script merges a PR only when every `Full CI (all green)` check on
  # its head succeeded. A skipped job counts as passed elsewhere, so this job
  # passes only when the job above ran and succeeded.
  full-ci:
    name: Full CI (all green)
    needs: [inbox-pi]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full') && (github.event.action != 'labeled' || github.event.label.name == 'ci:full') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job above succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
