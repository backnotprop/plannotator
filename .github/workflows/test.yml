name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# The fast tier: every PR push runs this workflow and Security. The heavy
# suites (Windows, Release dry run, Inbox e2e / Pi / Claude Code / relay) run on
# a PR only once it has the `ci:full` label; see windows.yml.
#
# One run per PR at a time: a new push cancels the PR's older run, which no one
# will merge. A push to main is never cancelled: deploy.yml runs after the Test
# run of each main commit, so every one of them gets a group of its own.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything that is not a sharded test file: the checks that used to lead
  # the single test job, and the two DOM steps that must run in processes of
  # their own.
  checks:
    name: Checks (types, packages, own-process DOM tests, lane guards)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check release version consistency
        run: bun run check:release-version

      - name: Generate Pi extension shared copies
        run: bash apps/pi-extension/vendor.sh

      - name: Type check
        run: bun run typecheck

      - name: Smoke-test published UI package
        # This packs the real tarball and installs it with a pinned pnpm CLI in
        # a temp consumer outside the monorepo. It prevents workspace protocols
        # from leaking into the manifest published to external consumers.
        run: bun run --cwd packages/ui smoke:package

      # The smoke's pack (`prepack`) generates the bridge asset files, which are
      # gitignored. This is the one job where they exist, so the check that the
      # generated asset matches the current bridge source runs here; in the
      # unit lanes it skips (no asset on a fresh checkout).
      - name: Check the generated bridge asset against its source
        run: bun test packages/ui/components/html-viewer/bridgeAsset.test.ts

      # The extension has its own tsconfig (Node libs, no DOM) and is not part
      # of the root typecheck, so nothing was checking it. A type error in the
      # panel cookie seed shipped that way; this is the step that would have
      # caught it.
      - name: Type check VS Code extension
        run: bun run --cwd apps/vscode-extension lint

      # The file-browser watcher test is timing-sensitive (a 120ms SSE debounce
      # asserted with real timers). Run it in its own process — matching the
      # historical config — so it isn't destabilized by sharing a process with
      # the rest of the ui suite (heavy load intermittently starves the debounce
      # timer and the reconnect refetch is missed). See useFileBrowser.test.tsx.
      - name: Run file-browser DOM test (isolated)
        run: DOM_TESTS=1 bun test packages/ui/hooks/useFileBrowser.test.tsx

      # These render against the REAL @pierre/diffs, because the defects they
      # cover (a stale render cache served across a cacheKey collision; an
      # empty stub card) only exist inside its renderer. A file in the DOM list,
      # AllFilesCodeView.lifecycle.test.tsx, calls
      # `mock.module('@pierre/diffs', ...)` with a hunk-less getSingularPatch
      # and `processFile: () => null` — and bun's module mocks are process
      # global with no restore, so in one shared process the real renderer is
      # not guaranteed to still be there by the time these load. That leak
      # reproduced on the Linux runner and not on macOS. Their own process
      # removes the coupling outright, same reasoning as the isolated step
      # above. scripts/ci-test-lanes.test.ts keeps them out of the DOM list.
      - name: Run diff-renderer DOM tests (isolated, real @pierre/diffs)
        run: >-
          DOM_TESTS=1 bun test
          packages/review-editor/components/DiffViewer.fullContentSwap.test.tsx
          packages/review-editor/components/DiffViewer.oversizedStub.test.tsx
          packages/review-editor/components/DiffViewer.binaryNotice.test.tsx
          packages/review-editor/components/DiffViewer.imagePreview.test.tsx
          packages/review-editor/components/DiffViewer.headerControls.test.tsx
          packages/review-editor/components/DiffViewer.markdownPreview.test.tsx
          packages/review-editor/components/DiffViewer.changeNavigation.test.tsx

      # The DOM list (tests/dom-test-list.txt) is hand-maintained, and every
      # feature that adds a DOM-gated test file has to remember it — which is
      # exactly what stopped happening (34 tests guarding shipped controls never
      # ran). This asserts that every DOM-gated test file in the repo is in the
      # list or in one of the own-process steps above, so it cannot drift again.
      # The lane guard holds the matrices below to scripts/ci-test-lane.ts, so
      # no shard can be dropped without failing here.
      - name: Guard the DOM test allowlist and the test lanes
        run: bun test scripts/dom-test-allowlist.test.ts scripts/ci-test-lanes.test.ts

  # The plain `bun test` sweep, split across jobs (scripts/ci-test-lane.ts).
  # It took 20-23 min as one process; each lane now takes about 4-7 min.
  # Few lanes on purpose: every job of a run asks for a runner at once, and
  # the account has about 20 concurrent runners for every workflow and PR.
  # heavy-*: the files that drive real agent processes, one process each.
  # unit-k: Bun's own --shard=k/N over every other discovered file, so a new
  # test file always lands in some shard.
  unit:
    name: Unit tests (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    # A backstop, not a budget: lanes take about 4-7 min. Some tests run on
    # fake timers, where bun's per-test timeout cannot fire, so a stuck await
    # would otherwise idle until GitHub's 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [heavy-mod, heavy-agents, unit-1, unit-2, unit-3]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Pi extension shared copies
        run: bash apps/pi-extension/vendor.sh

      - name: Run tests
        env:
          LANE: ${{ matrix.lane }}
        run: bun run scripts/ci-test-lane.ts "$LANE"

  # DOM-gated tests: tests/dom-test-list.txt with happy-dom globals, split
  # across jobs. Files get isolated globals (--isolate) because theme, storage,
  # and DOM test state must not leak between suites when Bun schedules them
  # differently across platforms; without it most of the list fails.
  dom:
    name: DOM tests (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    # A backstop, not a budget: lanes take about 3-6 min. Some DOM tests run on
    # fake timers, where bun's per-test timeout cannot fire.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [dom-1, dom-2, dom-3, dom-4]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Pi extension shared copies
        run: bash apps/pi-extension/vendor.sh

      - name: Run DOM tests
        env:
          LANE: ${{ matrix.lane }}
        run: bun run scripts/ci-test-lane.ts "$LANE"

  opencode-v2:
    name: OpenCode 2 installed package
    runs-on: ubuntu-24.04
    # The smoke's own budgets (health 120s, plugin activation 300s) are the real assertion;
    # this is only a backstop so a genuinely wedged runner cannot idle for hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install OpenCode 2
        # zizmor: ignore[adhoc-packages] This integration test requires the exact
        # globally installed CLI. Owner: maintainers; reassess a locked fixture
        # by 2027-08-11.
        # OpenCode 2 publishes as @opencode/cli since upstream moved to the
        # opencode npm scope (@opencode-ai/cli stopped at 0.0.0-*-192xx). The
        # package still ships the `opencode2` bin the smoke step resolves.
        run: npm install --global @opencode/cli@2.0.19

      - name: Build OpenCode plugin assets
        run: bun run build:review && bun run build:hook && bun run build:opencode

      # This is the only job with the single-file bundles on disk, so it is the
      # only place the built-artifact assertions in entry-assets can actually
      # run (they skip on an unbuilt checkout). Chief among them: no inlined
      # WebAssembly survived the bundle.
      - name: Assert built bundles ship no inlined WASM
        run: bun test tests/entry-assets.test.ts

      - name: Pack OpenCode plugin
        working-directory: apps/opencode-plugin
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - name: Run installed-package smoke
        # Glob the tarball so this job survives version bumps; npm pack wrote
        # exactly one plannotator-opencode-*.tgz into RUNNER_TEMP above.
        # The pinned host has the native command API, so a markdown stub
        # still owning a /plannotator-* name is a real shadowing bug: fail on it.
        env:
          PLANNOTATOR_SMOKE_EXPECT_NATIVE: "1"
        run: >-
          bun run --cwd apps/opencode-plugin smoke:v2 --
          "$(command -v opencode2)"
          "$RUNNER_TEMP"/plannotator-opencode-*.tgz

      # The Plannotator Inbox connection on the same installed package: the
      # plannotator_inbox tool and the reply wake, on the real OpenCode 2 with
      # a scripted model endpoint, against the binary compiled with the
      # release flags (apps/opencode-plugin/inbox-v2.test.ts).
      - name: Compile the binary for the Inbox proofs
        run: >-
          bun build apps/hook/server/index.ts --compile --no-compile-autoload-bunfig
          --define '__CLI_VERSION__="0.0.0-dev"' --outfile .local/plannotator

      - name: Run the T3 connected-session proofs on the compiled binary
        env:
          T3_TEST_EXECUTABLE: ${{ github.workspace }}/.local/plannotator
        run: bun test packages/t3-code

      - name: Run the Inbox connection proofs on the installed package
        env:
          PLANNOTATOR_INBOX_TEST_BINARY: ${{ github.workspace }}/.local/plannotator
          INBOX_PROOF_DIR: ${{ github.workspace }}/.local/proof/inbox-opencode
        run: |
          export OPENCODE2_BIN="$(command -v opencode2)"
          export OPENCODE_PLUGIN_TARBALL="$(ls "$RUNNER_TEMP"/plannotator-opencode-*.tgz)"
          export PLANNOTATOR_DATA_DIR="$(mktemp -d)"
          bun test apps/opencode-plugin/inbox-v2.test.ts apps/opencode-plugin/inbox.test.ts

      - name: Keep the Inbox transcripts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inbox-opencode-proof
          path: .local/proof/
          if-no-files-found: ignore

  guides-show:
    name: guides.show viewer (budgets + pinned manifest)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The merge commit plus both parents, so the path gate below can diff
          # the PR against its base without fetching the whole history.
          fetch-depth: 2

      # Path gate. The viewer build only reads apps/guides-show and the packages
      # it bundles, so an unrelated PR skips the install and the build. Anything
      # this cannot resolve (a push to main, a manual run, a checkout that is not
      # the PR merge commit) runs the job: skipping is the risky direction.
      - name: Does this change touch the viewer's inputs?
        id: gate
        run: |
          set -eu
          run=true
          # HEAD is the PR merge commit, so HEAD^1 is the base tip and diffing
          # the two is exactly the PR's changes. Requiring HEAD^2 confirms this
          # really is the merge commit before trusting that.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
             && base=$(git rev-parse --verify --quiet 'HEAD^1') \
             && git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            changed=$(git diff --name-only "$base" HEAD)
            if grep -Eq '^(apps/guides-show/|packages/(guide-viewer|ui|review-editor|core)/)' <<< "$changed"; then
              run=true
            else
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.gate.outputs.run == 'true'
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      # The release workflow (guides-show-deploy.yml) refuses to publish when
      # the viewer build blows its size budgets, but that gate fires at the
      # tag, so a budget break has to surface on the PR that causes it.
      - name: Build viewer
        if: steps.gate.outputs.run == 'true'
        run: bun run --cwd apps/guides-show build:viewer

      - name: Size budgets
        if: steps.gate.outputs.run == 'true'
        run: bun run --cwd apps/guides-show check:budgets

      # The viewer pin (packages/core/guide-viewer-manifest.ts) is generated,
      # never committed: every shipping build runs `bun run build:viewer-pin`.
      # Prove the generator still turns this build into a module core accepts,
      # since the release, the guides.show deploy and core's prepack rely on it.
      - name: Generate the viewer pin from this build
        if: steps.gate.outputs.run == 'true'
        run: |
          bun run --cwd apps/guides-show sync:manifest
          cd packages/core && bunx tsc --noEmit -p tsconfig.json
