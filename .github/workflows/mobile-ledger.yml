name: Mobile ledger

# The parity ledger's clock (scripts/mobile/parity-debts.ts,
# docs/agent-guides/mobile.md): a decision left `undecided`, or a debt the
# app `owed`, for more than 14 days fails it. It runs nightly, by hand, on a
# push to main that changes apps/mobile/contract/parity/ledger.json, and on a
# pull request only when the clock itself changes. An Inbox pull request
# records new entries in the ledger, so the ledger is never a pull request
# path here: no Inbox pull request ever starts this job. It is a script, not
# a test file, so no `bun test` runs it, and it is never a required check:
# red here holds back only the app's own release.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/mobile/parity-debts.ts'
      - '.github/workflows/mobile-ledger.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/contract/parity/ledger.json'
      - 'scripts/mobile/parity-debts.ts'
      - '.github/workflows/mobile-ledger.yml'
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    name: The parity ledger's clock (no decision or debt older than 14 days)
    concurrency:
      group: mobile-ledger-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true

      - name: Check the ledger's dates
        run: bun scripts/mobile/parity-debts.ts
