name: Inbox relay

# The Plannotator Inbox relay (apps/relay, mobile plan step R1), proved in
# action: apps/relay/test/relay.test.ts runs the Worker under `wrangler dev`
# (local workerd, no account, no deploy) with the COMPILED Inbox binary
# pointed at it, agents writing through `plannotator inbox mcp`, and a local
# HTTP/2 server playing Apple and local servers playing Google's token
# endpoint and FCM (R3, with a throwaway RSA service account); then one push
# to Apple's real sandbox with a throwaway key, which Apple answers 403
# InvalidProviderToken (the transport works). The relay is owner-deployed: nothing here deploys it. Runs only when
# the relay or the Inbox code it talks to could have changed.

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/relay/**'
      - 'packages/server/inbox*'
      - 'packages/shared/inbox/**'
      - 'packages/core/crypto*'
      - 'packages/core/fixtures/inbox-relay*'
      - 'packages/core/inbox*'
      - 'apps/hook/server/index.ts'
      - 'apps/hook/server/inbox*'
      - 'scripts/inbox-sim.ts'
      - 'tests/helpers/inbox-world.ts'
      - 'tests/helpers/inbox-process.ts'
      - 'tests/helpers/real-data-dir.ts'
      - 'tests/helpers/hook-dist-stub.ts'
      - 'tests/setup/sandbox-data-dir.ts'
      - 'packages/shared/data-dir.ts'
      - 'bun.lock'
      - '.github/workflows/relay.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/relay/**'
      - 'packages/server/inbox*'
      - 'packages/shared/inbox/**'
      - 'packages/core/crypto*'
      - 'packages/core/fixtures/inbox-relay*'
      - 'packages/core/inbox*'
      - 'apps/hook/server/index.ts'
      - 'apps/hook/server/inbox*'
      - 'scripts/inbox-sim.ts'
      - 'tests/helpers/inbox-world.ts'
      - 'tests/helpers/inbox-process.ts'
      - 'tests/helpers/real-data-dir.ts'
      - 'tests/helpers/hook-dist-stub.ts'
      - 'tests/setup/sandbox-data-dir.ts'
      - 'packages/shared/data-dir.ts'
      - 'bun.lock'
      - '.github/workflows/relay.yml'

permissions:
  contents: read

# One run per PR, and one per main: a newer push cancels the older run (main
# included: only its newest commit needs the heavy suites). Adding any other
# label starts a run that skips every job; it gets a group of its own so it
# cannot cancel the real one.
concurrency:
  group: relay-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ci:full' && format('run-{0}', github.run_id) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  relay:
    name: Inbox relay (wrangler dev with the compiled binary)
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:full') && (github.event.action != 'labeled' || github.event.label.name == 'ci:full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the apps and compile the binary
        run: >-
          bun run build:review && bun run build:hook &&
          bun build apps/hook/server/index.ts --compile --no-compile-autoload-bunfig
          --define '__CLI_VERSION__="0.0.0-dev"' --outfile .local/plannotator

      - name: Run the relay proof
        working-directory: apps/relay
        # INBOX_PROOF_DIR: the carriage's transcript and storage dumps (ids, hashes and envelopes only), kept with the logs.
        run: PLANNOTATOR_INBOX_TEST_BINARY="$GITHUB_WORKSPACE/.local/plannotator" RELAY_PROOF_APPLE=1 INBOX_PROOF_DIR="$GITHUB_WORKSPACE/.local/relay-proof" bun test

      - name: Keep the relay's logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-proof
          path: |
            apps/relay/.wrangler/proof-*/wrangler.log
            .local/relay-proof/
          if-no-files-found: ignore

  # The merge script merges a PR only when every `Full CI (all green)` check on
  # its head succeeded. A skipped job counts as passed elsewhere, so this job
  # passes only when the job above ran and succeeded.
  full-ci:
    name: Full CI (all green)
    needs: [relay]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full') && (github.event.action != 'labeled' || github.event.label.name == 'ci:full') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job above succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
