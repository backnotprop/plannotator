name: Inbox relay

# The Plannotator Inbox relay (apps/relay, mobile plan step R1), proved in
# action: apps/relay/test/relay.test.ts runs the Worker under `wrangler dev`
# (local workerd, no account, no deploy) with the COMPILED Inbox binary
# pointed at it, agents writing through `plannotator inbox mcp`, and a local
# HTTP/2 server playing Apple; then one push to Apple's real sandbox with a
# throwaway key, which Apple answers 403 InvalidProviderToken (the transport
# works). The relay is owner-deployed: nothing here deploys it. Runs only when
# the relay or the Inbox code it talks to could have changed.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/relay/**'
      - 'packages/server/inbox*'
      - 'packages/shared/inbox/**'
      - 'packages/core/crypto*'
      - 'packages/core/fixtures/inbox-relay*'
      - 'packages/core/inbox*'
      - 'apps/hook/server/index.ts'
      - 'apps/hook/server/inbox*'
      - 'scripts/inbox-sim.ts'
      - 'tests/helpers/inbox-world.ts'
      - 'bun.lock'
      - '.github/workflows/relay.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/relay/**'
      - 'packages/server/inbox*'
      - 'packages/shared/inbox/**'
      - 'packages/core/crypto*'
      - 'packages/core/fixtures/inbox-relay*'
      - 'packages/core/inbox*'
      - 'apps/hook/server/index.ts'
      - 'apps/hook/server/inbox*'
      - 'scripts/inbox-sim.ts'
      - 'tests/helpers/inbox-world.ts'
      - 'bun.lock'
      - '.github/workflows/relay.yml'

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: Inbox relay (wrangler dev with the compiled binary)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the apps and compile the binary
        run: >-
          bun run build:review && bun run build:hook &&
          bun build apps/hook/server/index.ts --compile --no-compile-autoload-bunfig
          --define '__CLI_VERSION__="0.0.0-dev"' --outfile .local/plannotator

      - name: Run the relay proof
        working-directory: apps/relay
        # INBOX_PROOF_DIR: the carriage's transcript and storage dumps (ids, hashes and envelopes only), kept with the logs.
        run: PLANNOTATOR_INBOX_TEST_BINARY="$GITHUB_WORKSPACE/.local/plannotator" RELAY_PROOF_APPLE=1 INBOX_PROOF_DIR="$GITHUB_WORKSPACE/.local/relay-proof" bun test

      - name: Keep the relay's logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-proof
          path: |
            apps/relay/.wrangler/proof-*/wrangler.log
            .local/relay-proof/
          if-no-files-found: ignore
