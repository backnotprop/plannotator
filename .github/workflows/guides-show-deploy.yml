name: guides.show deploy

# Publishes the portable Guided Review viewer to guides.show. Runs on Plannotator
# release tags (decision record D10) so a viewer build == a Plannotator version,
# and on manual dispatch. Viewer files are add-only in R2 (D8): the deploy
# script refuses to overwrite an entry with different bytes and never deletes.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: guides-show-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format compatibility (every shipped fixture parses) + worker tests
        run: bun test ./packages/core/guide-format.test.ts ./apps/guides-show/worker ./apps/guides-show/share ./apps/guides-show/viewer

      - name: Build viewer
        run: bun run --cwd apps/guides-show build:viewer

      - name: Size budgets
        run: bun run --cwd apps/guides-show check:budgets

      - name: Checked-in manifest matches this build
        run: bun run --cwd apps/guides-show check:manifest

      - name: Publish viewer files to R2 (add-only)
        run: bun run --cwd apps/guides-show deploy:viewer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker + landing
        working-directory: apps/guides-show
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke the published viewer entry
        run: |
          JS=$(bun -e "import { GUIDE_VIEWER_MANIFEST } from './packages/core/guide-viewer-manifest.ts'; console.log(GUIDE_VIEWER_MANIFEST.js)")
          curl -fsSI "https://guides.show/v1/$JS" | tee /tmp/headers.txt
          grep -qi 'cache-control: public, max-age=31536000, immutable' /tmp/headers.txt
          grep -qi 'access-control-allow-origin: \*' /tmp/headers.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guides-show-viewer-manifest
          path: apps/guides-show/dist/viewer/manifest.json
