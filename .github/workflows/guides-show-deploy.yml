name: guides.show deploy

# Publishes the portable Guided Review viewer to guides.show. Runs on Plannotator
# release tags (decision record D10) so a viewer build == a Plannotator version,
# and on manual dispatch. Viewer files are add-only in R2 (D8): the deploy
# script refuses to overwrite an entry with different bytes and never deletes.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: guides-show-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format compatibility (every shipped fixture parses) + worker tests
        run: bun test ./packages/core/guide-format.test.ts ./apps/guides-show/worker ./apps/guides-show/share ./apps/guides-show/viewer ./apps/guides-show/build

      - name: Build viewer
        run: bun run --cwd apps/guides-show build:viewer

      - name: Size budgets
        run: bun run --cwd apps/guides-show check:budgets

      - name: Checked-in manifest matches this build
        run: bun run --cwd apps/guides-show check:manifest

      - name: Publish viewer files to R2 (add-only)
        id: publish
        run: bun run --cwd apps/guides-show deploy:viewer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker + landing
        working-directory: apps/guides-show
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Every file of this build (entries, worker, chunks/, assets) must answer
      # on guides.show, and the entry must carry the immutable cache and CORS
      # headers. Runs whenever the publish step succeeded, even when the Worker
      # deploy failed, so a partial publish never passes unnoticed.
      - name: Smoke the published viewer (every file + entry headers)
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: bun run --cwd apps/guides-show verify:viewer

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guides-show-viewer-manifest
          path: apps/guides-show/dist/viewer/manifest.json
