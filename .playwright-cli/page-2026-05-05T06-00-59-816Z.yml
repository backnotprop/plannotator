                - text: ", etc. Important nuance from the human owner: - This is not merely a tag-count problem. - Tags should only exist if they open useful windows into the work. - But some deliberate duplication of hierarchy into tags may be worthwhile, because it gives immediate slicing/filtering in Kanban. - Example: a tag that mirrors a phase may still be useful if it creates an immediate slice that is much faster than navigating the tree or DAG. - Conversely, many current tags are effectively dead metadata. Example: filtering by"
