                - code [ref=e244]: PHASE-0
                - text: "; perhaps that concept should be carried better by the phase itself, or perhaps a different system should exist. - Freeform agent-authored tags are suspect. A one-off tag on a task that is not part of a broader organizational system is effectively invisible unless someone enumerates the whole tag vocabulary. Current uncertainty / design question: This may be an information-architecture problem more than a tagging problem. I need to decide whether the organizing axes should be things like: - feature / subsystem / product area, - plan, - phase, - proof-vs-implementation, - interface surface (CLI, hook, opencode, UI, storage, daemon), - risk / spec / semantics, - or something else. Competing candidate directions include: 1. Feature-first: - define a stable feature taxonomy (for example daemon lifecycle, state machine, CLI, review flow, annotate flow, E2E infra, persistence, integrations) and tag plans/phases/tasks by feature. - hierarchy stays executional (plan -> phase -> task). 2. Plan/phase-first: - always tag tasks with their plan and/or phase, and tag phases with their plan, so Kanban filtering can jump directly to execution slices. 3. Hybrid: - mandatory structural tags for quick slicing, plus a very small controlled cross-cutting vocabulary like"
                - code [ref=e245]: proof
