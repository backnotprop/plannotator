                - code [ref=e251]: PHASE-2-TDD
                - text: ","
                - code [ref=e252]: TASK-S-6
                - text: ","
                - code [ref=e253]: TASK-E03
                - text: ","
                - code [ref=e254]: TASK-D2
                - text: ") would look under the proposed system. 10. Stop/reconsult triggers: what evidence would indicate the recommended tagging architecture is wrong after adoption. Constraints: - Current practical use of tags is one-click human filtering of Kanban to create windows/slices into existing work. - Tree views and DAGs already carry a lot of structural information. - Redundant tags are acceptable if they materially improve slicing. - Invisible singleton tags are not acceptable. - Allowing agents to mint arbitrary tags is likely a mistake unless there is a strict organizational system behind it. - Prefer a system that is legible to both humans and agents, but optimize first for current human use. Do not merely affirm the current direction. Improve it, reject weak assumptions, and be explicit about what should not be encoded as tags."
