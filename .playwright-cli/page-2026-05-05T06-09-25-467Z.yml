                  - paragraph [ref=e1094]: "The architecture should be reconsidered if any of these occur after adoption:"
                  - list [ref=e1095]:
                    - listitem [ref=e1096]:
                      - paragraph [ref=e1097]: More than a few new non-structural tags are proposed during one sprint.
                    - listitem [ref=e1098]:
                      - paragraph [ref=e1099]: Humans still need to enumerate the full tag vocabulary to discover useful filters.
                    - listitem [ref=e1100]:
                      - paragraph [ref=e1101]: Most useful filters are phase-only; then area/work tags may be unnecessary.
                    - listitem [ref=e1102]:
                      - paragraph [ref=e1103]: Area filters return overly broad piles, for example almost the entire plan, so they do not create actionable Kanban windows.
                    - listitem [ref=e1104]:
                      - paragraph [ref=e1105]:
                        - text: Review questions repeatedly require a missing axis, such as “show externally risky contract changes” or “show tasks requiring independent audit.” That indicates a
                        - code [ref=e1106]: reviewGates
                        - text: or
                        - code [ref=e1107]: risk
                        - text: field may be needed.
                    - listitem [ref=e1108]:
                      - paragraph [ref=e1109]: A recurring concept needs its own status, success criteria, and dependencies. That concept should probably become a first-class tracker type or explicit field, not a tag.
                    - listitem [ref=e1110]:
                      - paragraph [ref=e1111]: Agents repeatedly place concepts in titles/bodies that humans later need as filters. That means the controlled vocabulary is missing a real axis.
                    - listitem [ref=e1112]:
                      - paragraph [ref=e1113]:
                        - text: Generated structural tags disagree with
                        - code [ref=e1114]: parents
                        - text: . That means tags are being edited manually and the projection mechanism is not enforced.
                  - paragraph [ref=e1115]: The target state is not “few tags.” The target state is that every visible tag corresponds to a known filter action, and every canonical relationship lives outside tags.
