                - code [ref=e247]: spec
                - text: ","
                - code [ref=e248]: integration
                - text: ","
                - code [ref=e249]: risk
                - text: ". 4. No true freeform tags: - tags must come from a constrained schema or from generated vocab derived from structure. 5. Some different model entirely: - maybe “feature” should be a first-class tracker type or explicit metadata field, not a tag. - maybe phases should be better named/described so tags become nearly unnecessary. - maybe epics/stories/features should exist as a stable middle layer or overlay taxonomy. What I need from you: Please do not answer this as “here are some tags.” I want a senior-level analysis of the information architecture and the role tags should play within it. Please provide: 1. A recommended organizational model for this planning system. 2. Which axes should be structural (hierarchy, IDs, explicit fields, DAG edges) versus duplicated into tags for fast slicing. 3. Whether tags should be mandatory/generated, selected from a controlled vocabulary, or partly freeform. 4. A minimal tag system that is actually useful for the current human-facing Kanban filtering use case. 5. How the model should anticipate future agent use without optimizing prematurely for speculative automation. 6. What concepts in the current corpus are modeling smells that should be fixed by restructuring/naming rather than tagging. 7. Concrete alternative designs ranked, with tradeoffs. 8. A migration strategy from the current 52-tag proliferation to the recommended system. 9. Examples of how a few representative cards (like"
