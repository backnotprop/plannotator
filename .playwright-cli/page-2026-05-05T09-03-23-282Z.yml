              - generic [ref=e339]:
                - generic [ref=e344]:
                  - text: "I am a weaker coding agent seeking frontier-model planning/audit guidance. This problem is well enough specified for concrete decision recommendations, but I want pushback if any decision remains under-specified. Task goal: Resolve six top-level decision cards for a daemon refactor feature so blocked contract-writing and E2E planning work can proceed. The output should be recommended choices for D1-D6, rationale, interactions between decisions, concrete behavioral contracts, and what evidence would change the recommendation. Repository/project context: - Project: Plannotator, moving from per-invocation local servers to one persistent local single-user daemon plus CLI plus thin Claude/OpenCode wrappers. - Planning hierarchy: feature -> spec + plans -> phases -> tasks. Decision cards are top-level under the feature and block planning/implementation where semantics are unresolved. - We want durable, implementation-agnostic decisions that can be encoded into contract tasks and later proven by real E2E tests against built artifacts. Current facts: - Feature scope is local-only, single active review slot, deterministic collision handling, built-artifact E2E certification, and thin agent integrations. - Phase 0 is blocked until D1-D6 are resolved and translated into explicit contracts. - The feature card and spec card are already written; the current open work is specifically deciding daemon semantics. Please provide: 1. A recommended choice for each of D1-D6. 2. The strongest argument against each chosen option. 3. The interactions between decisions, especially places where one choice constrains another. 4. A concrete contract for each decision in observable terms: state before, operation, state after, stdout/stderr or JSON envelope shape, exit behavior, persistence effect, and recovery guidance where relevant. 5. Specific E2E or integration checks that should prove each decision. 6. Any unresolved point that truly still needs a separate human decision rather than agent inference. 7. Evidence or future conditions that would justify revisiting a recommendation. Do not merely affirm the apparent default direction. Push back where the current framing is weak, but if it is strong enough, make hard recommendations. Prefer a coherent overall contract to locally optimal but inconsistent decisions. === FEATURE CARD === --- id: FEATURE-DAEMON-REFACTOR trackerStatus: type: feature parents: [] dependsOn: [] plans: - '[[PLAN-NIM-R]]' title: Local daemon refactor with E2E certification status: in-progress priority: critical owner: dzack description: Replace Plannotator's per-invocation server model with a persistent local single-user daemon, a stable CLI surface, and thin Claude Code/OpenCode wrappers, with completion certified by real built-artifact E2E tests. releaseVersion: daemon-refactor releaseNotes: 'Ships a local daemon-backed Plannotator workflow: one active review slot, daemon lifecycle commands, submit/wait/clear recovery, local-only operation, thin agent integrations, and proof-backed packaging.' --- ## Purpose This feature defines the daemon refactor. Plannotator moves from a per-invocation ephemeral-server tool to a local single-user daemon with a clean CLI as the primary interface. Claude Code and OpenCode integrations become thin wrappers around that CLI and keep only agent-specific policy. The feature card is the hierarchy root. Plans and specs are children of this feature, not peers and not duplicate source nodes. ## Child Cards - [[SPEC-DAEMON-E2E-CERTIFICATION]] defines the proof and acceptance contract. - [[PLAN-NIM-R]] executes the implementation and verification phases. ## User Outcome Agents interact with Plannotator through a stable local CLI instead of launching a fresh server for each invocation. A user can start the daemon once, submit plans or review documents repeatedly, recover from interrupted clients, clear stuck state, and verify that Claude Code and OpenCode wrappers pass decisions through the same daemon-backed contract. ## Scope - Local-only operation with no share URLs, paste service, public portal, or remote collaboration surface. - Single active document slot with deterministic collision handling. - Daemon lifecycle commands for start, stop, status, foreground mode, stale lock recovery, and fixed-port ownership. - Submit, wait, state, clear, approve, deny, cancel, review, annotate, draft, upload, and feedback paths served through the daemon. - CLI output and exit-code behavior stable enough for shell users, Claude hook JSON envelopes, and OpenCode JSON consumers. - Claude Code and OpenCode integrations reduced to thin CLI clients with agent-specific policy only. - Build and packaging aligned around one compiled daemon-plus-CLI artifact. - E2E proof coverage that drives real binaries, real daemon processes, real HTTP endpoints, real fixtures, and browser-visible behavior. ## Current Architecture Plannotator currently has per-invocation server entry points: - Plan review uses"
                  - code [ref=e345]: packages/server/index.ts
                  - text: through
                  - code [ref=e346]: startPlannotatorServer()
                  - text: . - Code review uses
                  - code [ref=e347]: packages/server/review.ts
                  - text: through
                  - code [ref=e348]: startReviewServer()
                  - text: . - Markdown annotation uses
                  - code [ref=e349]: packages/server/annotate.ts
                  - text: through
                  - code [ref=e350]: startAnnotateServer()
                  - text: . Each invocation binds a local port, opens a browser, blocks on a decision promise, and then exits through cleanup paths such as
                  - code [ref=e351]: /api/shutdown
                  - text: ", signals, or explicit stop handles. ## Target Architecture The target model is one long-running Bun daemon on a local port, serving a singleton review state machine and a browser-plus-CLI HTTP API. State model: -"
                  - code [ref=e352]: idle
                  - text: ": no active document; submissions are accepted. -"
                  - code [ref=e353]: in_review
                  - text: ": a document is submitted; the user is reviewing; agent CLI clients wait on a verdict. -"
                  - code [ref=e354]: verdict_ready
                  - text: ": the user acted, but the verdict has not been fully consumed under the accepted wait contract. Core daemon API: -"
                  - code [ref=e355]: GET /
                  - text: ": serve the UI matching the current mode. -"
                  - code [ref=e356]: GET /api/state
                  - text: or
                  - code [ref=e357]: /api/status
                  - text: ": return the current daemon state snapshot, according to the accepted API contract. -"
                  - code [ref=e358]: GET /api/wait
                  - text: ": wait for the verdict of the current active request. -"
                  - code [ref=e359]: POST /api/submit
                  - text: ": accept a new document only when idle; otherwise return structured collision guidance. -"
                  - code [ref=e360]: POST /api/approve
                  - text: ","
                  - code [ref=e361]: /api/deny
                  - text: ", and"
                  - code [ref=e362]: /api/cancel
                  - text: ": apply browser-driven state transitions. -"
                  - code [ref=e363]: POST /api/clear
                  - text: ": force reset to idle under the accepted clear contract. Persistent files: -"
                  - code [ref=e364]: ~/.plannotator/daemon.json
                  - text: "-"
                  - code [ref=e365]: ~/.plannotator/state.json
                  - text: "-"
                  - code [ref=e366]: ~/.plannotator/history/...
                  - text: "-"
                  - code [ref=e367]: ~/.plannotator/drafts/...
                  - text: "Port and locality model: - The daemon binds locally. - The CLI and integrations communicate with the local daemon. - Headless or remote use goes through user-managed port forwarding, not a Plannotator-hosted sharing service. ## Non-Goals - Queueing multiple active review documents. - Reintroducing share links, paste services, marketing portals, or public collaboration endpoints. - Treating mocks, fake backends, or package-level approximations as release certification. - Accepting passing unit tests as the terminal completion signal without fresh E2E runs from built artifacts. ## Retained Surfaces -"
                  - code [ref=e368]: packages/server/integrations.ts
                  - text: "-"
                  - code [ref=e369]: apps/vscode-extension/
                  - text: "-"
                  - code [ref=e370]: packages/server/storage.ts
                  - text: "-"
                  - code [ref=e371]: packages/server/draft.ts
                  - text: "## Primary Contracts The feature is not complete until the Phase 0 contracts are explicit and all dependent implementation/spec work conforms to them: - [[TASK-D1]] defines CLI and hook-shim exit codes. - [[TASK-D2]] defines verdict broadcast and wait-consumption semantics. - [[TASK-D3]] defines daemon crash and recovery behavior. - [[TASK-D4]] defines"
                  - code [ref=e372]: PLANNOTATOR_HOME
                  - text: "and state-directory behavior. - [[TASK-D5]] defines signal handling. - [[TASK-D6]] defines concurrent hook submission behavior. ## Implementation Slices The implementation work remains decomposed by [[PHASE-2]] and [[PHASE-2-TDD]]: - [[TASK-S-1]] removes remote collaboration surface area. - [[TASK-S-2]] creates the daemon state machine. - [[TASK-S-3]] creates the multiplexed daemon router. - [[TASK-S-4]] owns daemon lifecycle. - [[TASK-S-5]] adds submit, wait, state, and clear endpoints. - [[TASK-S-6]] defines the public CLI. - [[TASK-S-7]] adds local notifications. - [[TASK-S-8]] converts agent integrations into thin wrappers. - [[TASK-S-9]] updates build and packaging. - [[TASK-S-10]] performs final verification. ## Acceptance Summary This feature reaches"
                  - code [ref=e373]: done
                  - text: "only when [[PHASE-4]] passes: all semantic decisions are frozen, implementation slices satisfy their paired proof tasks, cross-slice E2E specs pass from clean state, and the final verification run proves the built artifact rather than TypeScript source alone. ## Risks - Detached daemon spawning may be cross-platform fragile. - Browser-side state may assume one fresh random port per session. - Wait and verdict delivery can lose or duplicate decisions if request identity is underspecified. - Removing share and marketing surfaces can expose hidden build assumptions. - Collision handling is a user-facing recovery surface and needs explicit proof. === SPEC CARD === --- id: SPEC-DAEMON-E2E-CERTIFICATION trackerStatus: type: spec parents: - '[[FEATURE-DAEMON-REFACTOR]]' dependsOn: [] title: Daemon refactor E2E certification spec status: in-progress priority: critical requirement: The daemon refactor must be accepted only after a built Plannotator artifact satisfies the daemon lifecycle, singleton state, submit/wait/clear, crash recovery, CLI, hook, plugin, storage, UI, packaging, and deleted-surface contracts. acceptanceCriteria: - The E2E harness builds the binary, creates isolated state, starts and stops the daemon, submits real fixtures, drives the UI/API, and cleans up daemon processes. - Verdict delivery, crash recovery, exit codes, state-directory routing, signal behavior, and concurrent submission behavior are specified before dependent E2E assertions are accepted. - Cross-surface tests cover lifecycle, state machine, submit/wait/clear, review, annotate, storage, UI actions, JSON output, Claude hook behavior, OpenCode plugin behavior, packaging, deleted surfaces, and composed full-scenario behavior. - Final verification runs from the built CLI/binary from empty state and leaves no daemon process or contaminated state behind. tags: - FEATURE-DAEMON-REFACTOR --- ## Requirement The daemon refactor is a correctness-critical feature. Acceptance requires executable evidence that the local daemon model works end to end for shell users, Claude Code hooks, and OpenCode plugin calls. The detailed test inventory lives in the phase and task cards under [[PLAN-NIM-R]]. This spec records the cross-cutting release contract that plan must satisfy. ## Contract Precedence Use this precedence order when a test or implementation detail conflicts: - [[FEATURE-DAEMON-REFACTOR]] defines the feature boundary and non-goals. - This spec defines the release contract and proof obligations. - Semantic decision cards define still-open behavior such as exit codes, verdict delivery, crash recovery, state directory routing, signal handling, and concurrent submissions. - E2E task cards define the executable proof inventory. ## Required Behavior - The daemon exposes one local singleton review slot and rejects concurrent submissions deterministically. - The CLI exposes daemon lifecycle, submit, review, annotate, wait, clear, and open commands with stable human and JSON output. - Browser actions transition daemon state through approve, deny, cancel, feedback, upload, and draft flows without per-invocation server shutdown. - Waiting clients receive verdicts according to the accepted [[TASK-D2]] contract. - Crashes, signals, stale lockfiles, port conflicts, and mismatched state directories follow the accepted [[TASK-D3]], [[TASK-D4]], and [[TASK-D5]] contracts. - Claude Code and OpenCode wrappers call the CLI and preserve their protocol-specific envelopes. - Removed remote/share surfaces stay absent from code, docs, package scripts, and UI. ## Required Semantic Contracts The E2E suite must pin down these contracts before release: - CLI exit codes and Claude hook JSON-envelope behavior for approve, deny, cancel, timeout, illegal state, daemon unavailable, daemon crash, malformed daemon response, port collision, schema mismatch, forced clear, storage failure, and malformed hook stdin. - Verdict delivery by request identity: eligible waiters for the same request receive the same verdict, unrelated later waits do not receive stale verdicts, and verdicts are never lost, duplicated to unrelated commands, or delivered to the wrong waiter. - Daemon crash behavior while submitters or waiters are blocked, after verdict persistence, before verdict persistence, and during reconnect or autostart. -"
