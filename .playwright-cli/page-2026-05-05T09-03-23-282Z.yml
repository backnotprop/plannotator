                  - text: "while any Phase 0 semantic card is unresolved. E2E specs may be drafted before those decisions close, but they must reference the accepted decision cards before they can become release-blocking proof. === DECISION CARDS === --- id: DECISION-D1 trackerStatus: type: decision parents: - '[[FEATURE-DAEMON-REFACTOR]]' dependsOn: [] title: Exit-code and hook-envelope contract status: unstarted chosen: '' options: - name: Conventional CLI codes with protocol-specific hook envelopes pros: - Preserves shell semantics while keeping Claude hook output protocol-valid. - Matches the existing draft direction for approve, deny, cancel, illegal state, and daemon-down cases. cons: - Requires a complete row-by-row table for daemon failures, malformed responses, storage failures, clear behavior, and signals. - name: Uniform nonzero CLI failures with hook-level translation pros: - Keeps CLI behavior simple and conventional for shell users. - Isolates Claude hook quirks in the shim layer. cons: - Requires careful proof that hook shims never leak CLI exit semantics into protocol envelopes. - name: Fully protocol-neutral exit model pros: - Gives every caller the same numeric code model. cons: - Risks violating hook expectations where JSON envelopes, not process exit codes, carry decisions. tags: - FEATURE-DAEMON-REFACTOR --- ## Decision Question What exact exit-code and JSON-envelope contract must the CLI and agent shims expose for approve, deny, cancel, timeout, illegal state, daemon unavailable, daemon crash while waiting, malformed daemon response, occupied port, schema mismatch, forced clear, storage failure, malformed hook stdin, and interrupted waits? ## Constraints - Hook shims must remain protocol-valid even when the daemon reports errors. - Shell users need stable nonzero behavior for operational failures. - E2E tests must be able to assert both process exit status and output shape. ## Decision Output Required - A complete table for CLI exit codes. - A complete table for Claude hook JSON-envelope behavior. - Any OpenCode-specific translation rules. - Recovery-command output requirements for actionable failures. --- id: DECISION-D2 trackerStatus: type: decision parents: - '[[FEATURE-DAEMON-REFACTOR]]' dependsOn: [] title: Verdict delivery and wait-consumption semantics status: unstarted chosen: '' options: - name: FIFO consumption pros: - Simple single-consumer model. - Avoids repeated stale verdict delivery by construction. cons: - Original submitter plus explicit waiters can race or starve. - Weak fit for multiple clients waiting on the same active request. - name: Broadcast to eligible waiters pros: - Original submitter and explicit waiters can all receive the same verdict. - Supports request-identity-based delivery without queueing. cons: - Requires explicit rules for late waiters and state cleanup after all eligible waiters resolve. - name: Persistent until explicit clear pros: - Makes late recovery straightforward. - Avoids losing verdicts after daemon restart. cons: - High stale-verdict risk unless request identity and clear semantics are strict. tags: - FEATURE-DAEMON-REFACTOR --- ## Decision Question Are verdicts addressed to request IDs and broadcast to all eligible waiters, consumed by one waiter, or persisted until explicit clear? ## Constraints - Later unrelated waits must never receive stale verdicts. - Multiple eligible clients may wait on the same active request. - State must return to idle under a deterministic rule after verdict delivery. ## Decision Output Required - Eligibility rules for waiters. - Late-waiter behavior after verdict resolution. - State cleanup rule after eligible waiters receive the verdict. - Stale-verdict isolation rule for later unrelated waits. --- id: DECISION-D3 trackerStatus: type: decision parents: - '[[FEATURE-DAEMON-REFACTOR]]' dependsOn: [] title: Daemon crash and recovery durability model status: unstarted chosen: '' options: - name: Durable active and verdict state pros: - Restart can recover active reviews and resolved verdicts. - Strongest recovery story for interrupted clients. cons: - Requires strict persisted-state schema and corruption behavior. - name: Ephemeral active state with explicit client failure pros: - Simpler daemon restart behavior. - Avoids reconstructing partially active browser/client state. cons: - Clients must receive clear failure and recovery guidance after daemon death. - name: Partial durability by state pros: - Can persist submitted plans, history, and verdicts without overpromising all active browser state. cons: - Requires exact per-state persistence rules and more nuanced E2E coverage. tags: - FEATURE-DAEMON-REFACTOR --- ## Decision Question Which daemon states survive daemon death, and what must blocked submitters or waiters do after reconnect, autostart, or daemon-down failure? ## Constraints - Crash recovery must distinguish daemon death from client death. - Verdicts must not be lost after they are durably accepted. - E2E tests must cover crash before and after verdict persistence. ## Decision Output Required - Durability rule for idle, active review, and verdict-ready states. - CLI behavior for reconnect, autostart, and daemon-down cases. - Recovery guidance for stale clients and persisted state. --- id: DECISION-D4 trackerStatus: type: decision parents: - '[[FEATURE-DAEMON-REFACTOR]]' dependsOn: [] title: PLANNOTATOR_HOME and daemon state-directory routing status: unstarted chosen: '' options: - name: Daemon-start-time home is authoritative pros: - One daemon owns one state directory for its lifetime. - Easy to reject mismatched clients deterministically. cons: - Clients must surface clear errors when their environment points elsewhere. - name: Per-invocation home routes to matching daemon pros: - Test isolation and multi-home workflows can be explicit. cons: - Requires port or registry logic for multiple homes. - name: Global daemon with per-request state roots pros: - Avoids multiple daemon processes. cons: - Blurs isolation and makes cleanup/state contamination harder to prove. tags: - FEATURE-DAEMON-REFACTOR --- ## Decision Question Does"
                  - code [ref=e379]: PLANNOTATOR_HOME
                  - text: "define daemon-start-time state, per-invocation routing, or another state ownership model? ## Constraints - E2E tests need isolated and cleanup-verifiable state roots. - Fixed-port behavior must be deterministic. - Mismatched daemon/client state directories must not silently corrupt or cross-read state. ## Decision Output Required - Cross-home client behavior. - Fixed-port and daemon metadata behavior. - Test serialization or port-override requirement. - Cleanup paths that the harness must inspect. --- id: DECISION-D5 trackerStatus: type: decision parents: - '[[FEATURE-DAEMON-REFACTOR]]' dependsOn: [] title: Signal handling for clients and daemon status: unstarted chosen: '' options: - name: Client SIGINT cancels only the client wait pros: - Keeps daemon alive and avoids implicit review cancellation. - Matches conventional terminal interruption behavior. cons: - Requires clear state rule for the still-active review. - name: Client SIGINT cancels the active request pros: - User interruption has visible product effect. cons: - Risky for hook clients and multiple waiters unless ownership is explicit. - name: Signals map to daemon shutdown semantics pros: - Simple operational model for process termination. cons: - Can conflate graceful shutdown, crash recovery, and user cancellation. tags: - FEATURE-DAEMON-REFACTOR --- ## Decision Question How do SIGINT, SIGTERM, broken stdin, and broken pipes affect waiting clients, active reviews, hook shims, and daemon lifecycle? ## Constraints - Graceful shutdown and crash recovery must remain distinguishable. - Hook shims must emit protocol-valid output or documented failure behavior. - Waiting CLI interruption must have stable exit behavior. ## Decision Output Required - Client SIGINT behavior and exit code. - Daemon state after interrupted submitters or waiters. - Hook stdin and broken-pipe behavior. - Daemon SIGTERM behavior during active and verdict-ready states. --- id: DECISION-D6 trackerStatus: type: decision parents: - '[[FEATURE-DAEMON-REFACTOR]]' dependsOn: [] title: Concurrent submission behavior status: unstarted chosen: '' options: - name: Single active review with deterministic collision rejection pros: - Matches the feature's singleton review-slot direction. - Keeps verdict routing and active state simple. cons: - Concurrent callers need actionable recovery guidance. - name: Queue submissions pros: - Allows multiple callers to submit without immediate rejection. cons: - Expands feature scope into ordering, persistence, cancellation, and multi-verdict routing. - name: Replace active request pros: - Keeps only one active slot while accepting later submissions. cons: - High risk of data loss and misdelivered verdicts. tags: - FEATURE-DAEMON-REFACTOR --- ## Decision Question What happens when multiple hooks or CLI clients attempt concurrent submissions while a review is already active? ## Constraints - The feature target is a single active review slot. - The first active request must not be overwritten accidentally. - The caller rejected by collision behavior needs protocol-valid output and an executable recovery path. ## Decision Output Required - Collision status code and CLI/hook output behavior. - Persistence rule for rejected submissions. - Verdict routing rule for the first active request. - Required recovery guidance for later callers."
