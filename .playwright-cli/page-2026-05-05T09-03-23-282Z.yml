                  - text: "behavior if the flag remains part of the CLI contract. - Recovery command behavior: human stderr and JSON output include an executable recovery command, and running it actually restores the daemon to a usable state. - Signal behavior for waiting CLIs, active submitters, hook stdin interruption, broken pipes, and daemon termination during active or verdict-ready states. - Fixed-port ownership when a non-Plannotator process occupies the port, stale daemon metadata exists, a second daemon starts, or a client reaches a daemon from the wrong state directory. ## Proof Surface The certification suite must use real artifacts and observable outcomes: - Build the CLI/binary before daemon E2E tests. - Spawn real daemon processes and assert their PID, port, lockfile, and cleanup behavior. - Drive real HTTP endpoints on"
                  - code [ref=e376]: localhost
                  - text: ". - Use real markdown, plan, git, and browser fixtures. - Assert stdout, stderr, exit codes, JSON shapes, state files, git history, draft files, DOM behavior, and process cleanup. - Run daemon tests serially where fixed port or singleton state makes parallelism unsafe. ## Certification Groups The executable certification inventory must cover: - Binary surface and packaging gates. - Daemon lifecycle, state machine, submit, wait, clear, crash recovery, and storage behavior. - Review, annotate, UI actions, image upload, cancel, reset, and draft behavior. - JSON output schema lock for programmatic consumers. - Claude Code hook shim and OpenCode plugin contract behavior. - Deleted-surface and documentation consistency checks. - Full scenario coverage that composes the earlier specs. ## Verification Coverage [[PLAN-NIM-R]] currently owns execution. [[PHASE-3]] and its"
                  - code [ref=e377]: TASK-E*
                  - text: "children own the cross-surface E2E proof inventory. [[PHASE-4]] owns final built-artifact verification. ## Release Gate The release gate is [[PHASE-4]]. It must run after the semantic, infrastructure, implementation, and E2E phases are accepted. Passing means the built artifact satisfies the daemon contract from empty state twice, without hidden mocks, stale daemon processes, or remote-surface regressions. ## Open Decision Dependencies This spec remains"
