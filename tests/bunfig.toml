# Bun reads only the bunfig.toml in the directory `bun test` runs from, so the
# root preloads are mirrored here for runs from this folder. Keep in step with
# the root bunfig.toml [test] section (guarded by tests/package-bunfig.test.ts).
[test]
preload = ["./setup/feedback-archive-off.ts", "../packages/ui/test-setup/happy-dom.ts"]
# The Inbox's browser proofs run under Playwright, not bun test (see the root bunfig.toml).
pathIgnorePatterns = ["e2e/**"]
