<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Plannotator Inbox</title>
    <!-- No type: /favicon.ico is served by the Inbox server, which picks the
         bytes from the persisted favicon style (Glass and Yellow are multi-size .ico
         files, Face is a PNG), so the response Content-Type is the truthful
         declaration. The sizes let the tab take Glass's hand-pixelled 16 or
         32 frame instead of a resample. See handleFavicon(). -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">

  </head>
  <body class="overflow-hidden overscroll-none antialiased">
    <div id="root" class="h-full overflow-hidden"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
