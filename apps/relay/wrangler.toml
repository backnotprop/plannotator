# The Plannotator Inbox relay (adr/implementation/inbox-mobile.md, section 4).
# Owner-deployed from this folder with `wrangler deploy`; never from CI.
# Lanes run it with `wrangler dev` only.
#
# Secrets, set once by the owner (`wrangler secret put <NAME>`), never in a file:
#   APNS_KEY      the APNs auth key, the .p8 file's text
#   APNS_KEY_ID   its key id
#   APNS_TEAM_ID  the Apple team id
# Without APNS_KEY the relay runs and every push answers
# `{ sent: false, reason: "no_apns_key" }`.
name = "plannotator-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Custom domain (top-level: must precede any [table] in TOML). OWNER-ITEMS
# item 20: recommended, not yet deployed.
routes = [
  { pattern = "relay.plannotator.ai", custom_domain = true }
]

# One Durable Object per mailbox, on SQLite storage.
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

# The brake on anonymous mailbox creation (POST /v1/mailboxes only), the same
# rule guides.show puts on its create route (apps/guides-show/wrangler.toml:
# 20 per minute per IP, period 60), in its own namespace so the two services
# do not share a count. Over it the Worker answers 429 with Retry-After: 60.
# Optional in the Env type: without this block nothing is braked.
[[ratelimits]]
name = "MAILBOX_CREATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 20
  period = 60
