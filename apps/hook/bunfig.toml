# Bun reads only the bunfig.toml in the directory `bun test` runs from, so the
# root preloads are mirrored here for runs from this package directory. Keep in
# step with the root bunfig.toml [test] section (guarded by
# tests/package-bunfig.test.ts).
[test]
preload = ["../../tests/setup/feedback-archive-off.ts", "../../packages/ui/test-setup/happy-dom.ts"]
# The mod's `claude plugin test` harness tests (see the root bunfig.toml).
pathIgnorePatterns = ["tests/**"]
