# The Xcode project's source. `xcodegen generate` (in apps/mobile/ios) writes PlannotatorInbox.xcodeproj, which is
# committed too: building needs only Xcode.
name: PlannotatorInbox
options:
  bundleIdPrefix: ai.plannotator
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  InboxCore:
    path: InboxCore
targets:
  PlannotatorInbox:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # The product's colours: the contract's generated catalog, referenced where it is generated, never copied.
      - path: ../contract/generated/swift/Tokens.xcassets
        group: Contract
    dependencies:
      - package: InboxCore
        product: InboxCore
      - package: InboxCore
        product: InboxStandIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Plannotator
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
        # No app icon yet: the icon is the owner's to supply.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Plannotator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: To scan the pairing code on your computer.
        NSLocalNetworkUsageDescription: To reach Plannotator on your computer over this Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: ai.plannotator.pair
            CFBundleURLSchemes:
              - plannotator
        ITSAppUsesNonExemptEncryption: false
  PlannotatorInboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PlannotatorInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: PlannotatorInbox
schemes:
  PlannotatorInbox:
    build:
      targets:
        PlannotatorInbox: all
        PlannotatorInboxUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PlannotatorInboxUITests
