# Tomorrow Night, as a base16 scheme (classic flat format).
# Palette: Chris Kempson's Tomorrow Night, as the base16 project documents it.
# Written by hand for Plannotator's converter tests; not downloaded.
scheme: "Tomorrow Night"
author: "Chris Kempson (http://chriskempson.com)"
base00: "1d1f21" # background
base01: "282a2e" # lighter background
base02: "373b41" # selection
base03: "969896" # comments
base04: "b4b7b4" # dark foreground
base05: "c5c8c6" # foreground
base06: "e0e0e0"
base07: "ffffff"
base08: "cc6666" # red
base09: "de935f" # orange
base0A: "f0c674" # yellow
base0B: "b5bd68" # green
base0C: "8abeb7" # cyan
base0D: "81a2be" # blue
base0E: "b294bb" # magenta
base0F: "a3685a" # brown
