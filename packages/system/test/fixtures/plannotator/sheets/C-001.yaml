notes:
  a: { on: cli, text: "Plan review has no daemon. The agent's hook runs plannotator, which serves the page, waits for your decision, prints it on stdout and exits." }
  b: { on: inbox, text: "One Inbox per computer, on loopback. Agents call its /mcp; plugin hosts long-poll its bridge for your replies. Phones and the relay are built but off by default (see The Inbox)." }
  c: { on: desktop, text: "The desktop app is built in another repo. It shows this computer's Inbox page." }
  d: { on: workspaces, text: "Workspaces is a hosted product built in another repo. This drawing draws only where Plannotator meets it." }
