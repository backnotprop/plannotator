# The Inbox: how an agent reaches it, what it keeps on disk, and how your
# answer wakes the agent.
sheet: L-201
scope: inbox
kind: logical
title: The Inbox
question: How an agent's question reaches you, and how your answer wakes the agent.
bands:
  - id: agents
    label: Agents
    means: the first two wake through their plugin; the Inbox wakes Codex, Qwen and T3 itself
    tone: sand
    row: [iclaude 2, iplugins 3, imcp 4, icodex 2, iqwen 2, it3 2]
  - id: ways
    label: Ways in
    means: started by the agent or by plannotator inbox
    tone: mist
    row: [shim 4, isetup 4, ilaunch 4]
  - id: core
    label: The Inbox
    means: one per computer, 127.0.0.1
    tone: stone
    row: [iwindow 4, iserver 4, ilinks 4]
  - id: disk
    label: On disk
    means: ~/.plannotator/inbox
    tone: sage
    row: [istore 3, iregistry 3, idoor 3, irelayc 3]
    split: { before: idoor, left: on disk, right: "for phones, off until they ship" }
show: [x-ping2, i_claude, i_plugins, i_stdio, i_t3stdio, i_shim, i_wcodex, i_wqwen, i_wt3, i_setup, i_store, i_reg, i_page, i_you, i_links, i_relay, i_door, i_launch]
notes:
  a: { on: iserver, text: "The server is the only writer of the store. Every route that controls it wants a loopback Host, no Origin and the registry's token." }
  b: { on: ilaunch, text: "Launch is off by default (inboxLaunch.enabled in config.json only)." }
  c: { on: i_wt3, text: "T3 runs Claude through the Agent SDK, where the mod stands down, so the Inbox sends the reply into the thread itself." }
