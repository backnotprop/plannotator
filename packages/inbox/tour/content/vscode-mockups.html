<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guided Reviews in VS Code: four directions</title>
<style>
/* ── Page chrome (outside the VS Code window) ─────────────────────────── */
:root {
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", Menlo, Monaco, "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #0b0c0e; color: #d4d4d4; font-family: var(--ui); }
.ctl { position: sticky; top: 0; z-index: 50; background: #0b0c0e; border-bottom: 1px solid #26282c; padding: 12px 20px 12px; display: grid; gap: 8px; }
.ctl h1 { margin: 0; font-size: 13px; font-weight: 600; color: #e6e6e6; letter-spacing: .01em; }
.ctl h1 span { color: #8b8f96; font-weight: 400; }
.ctl-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl-label { font-size: 11px; color: #8b8f96; text-transform: uppercase; letter-spacing: .06em; width: 58px; }
[role=tablist] { display: flex; gap: 4px; flex-wrap: wrap; }
[role=tab] { font: 12.5px var(--ui); color: #c9ccd1; background: #17191c; border: 1px solid #2c2f34; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
[role=tab]:hover { border-color: #4a4e55; }
[role=tab][aria-selected=true] { background: #0f3a5c; border-color: #2f7fc1; color: #fff; }
[role=tab]:focus-visible { outline: 2px solid #4daafc; outline-offset: 2px; }
.ctl-cap { font-size: 12.5px; color: #b9bdc3; line-height: 1.5; max-width: 1440px; }
.ctl-cap b { color: #fff; font-weight: 600; }
.stage { padding: 20px; overflow: auto; }
body.shot .ctl { display: none; }
body.shot .stage { padding: 0; }

/* ── VS Code window, Dark Modern ──────────────────────────────────────── */
.vs { width: 1440px; height: 900px; background: #1f1f1f; color: #cccccc; font: 13px var(--ui); display: flex; flex-direction: column; position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px #333, 0 30px 80px -20px #000; }
body.shot .vs { border-radius: 0; box-shadow: none; }
.titlebar { height: 35px; flex: none; background: #181818; border-bottom: 1px solid #2b2b2b; display: flex; align-items: center; position: relative; }
.lights { display: flex; gap: 8px; padding-left: 13px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.cc { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; }
.cc .arrows { color: #9d9d9d; font-size: 14px; letter-spacing: 10px; }
.cc .box { width: 520px; height: 24px; border: 1px solid #3c3c3c; background: #222; border-radius: 6px; color: #b8b8b8; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.tb-right { margin-left: auto; padding-right: 12px; display: flex; gap: 12px; color: #9d9d9d; }
.vbody { flex: 1; display: flex; min-height: 0; }
.activity { width: 48px; flex: none; background: #181818; border-right: 1px solid #2b2b2b; display: flex; flex-direction: column; align-items: center; padding-top: 4px; gap: 2px; }
.activity .ai { width: 48px; height: 46px; display: flex; align-items: center; justify-content: center; color: #868686; position: relative; }
.activity .ai.on { color: #d7d7d7; }
.activity .ai.on::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: #0078d4; }
.activity .grow { flex: 1; }
.activity .badge { position: absolute; right: 9px; bottom: 9px; background: #0078d4; color: #fff; font-size: 9px; border-radius: 8px; min-width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; }
.sidebar { flex: none; background: #181818; border-right: 1px solid #2b2b2b; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.sb-title { height: 35px; display: flex; align-items: center; padding: 0 8px 0 20px; font-size: 11px; color: #cccccc; text-transform: uppercase; letter-spacing: .04em; }
.sb-title .acts { margin-left: auto; color: #9d9d9d; display: flex; gap: 10px; text-transform: none; }
.sb-sec { height: 22px; display: flex; align-items: center; padding: 0 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #cccccc; gap: 4px; }
.tree { font-size: 13px; }
.tr { height: 22px; display: flex; align-items: center; gap: 6px; padding-right: 10px; color: #cccccc; white-space: nowrap; overflow: hidden; }
.tr .tw { width: 16px; text-align: center; color: #9d9d9d; font-size: 10px; flex: none; }
.tr .lbl { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.tr .desc { color: #8b8b8b; font-size: 12px; flex: none; }
.tr.sel { background: #04395e; outline: 1px solid #0078d4; outline-offset: -1px; color: #fff; }
.tr.hl { background: #2a2d2e; }
.cb { width: 14px; height: 14px; border: 1px solid #6b6b6b; border-radius: 3px; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; background: #313131; }
.cb.on { background: #0078d4; border-color: #0078d4; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.editors { flex: 1; display: flex; min-width: 0; }
.group { display: flex; flex-direction: column; min-width: 0; border-left: 1px solid #2b2b2b; background: #1f1f1f; }
.group:first-child { border-left: 0; }
.tabs { height: 35px; flex: none; background: #181818; display: flex; border-bottom: 1px solid #2b2b2b; }
.tab { height: 35px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; color: #9d9d9d; border-right: 1px solid #2b2b2b; font-size: 13px; white-space: nowrap; position: relative; }
.tab.on { background: #1f1f1f; color: #fff; border-bottom: 1px solid #1f1f1f; margin-bottom: -1px; }
.tab.on::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: #0078d4; }
.tab i { font-style: italic; }
.tab .x { color: #9d9d9d; margin-left: 4px; font-size: 13px; }
.tab .sub { color: #8b8b8b; }
.tab.on .sub { color: #b8b8b8; }
.tabs .tacts { margin-left: auto; display: flex; gap: 12px; align-items: center; padding: 0 12px; color: #9d9d9d; }
.crumbs { height: 22px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 12px; color: #a9a9a9; font-size: 12.5px; white-space: nowrap; overflow: hidden; }
.crumbs .sep { color: #6b6b6b; }
.gbody { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.statusbar { height: 22px; flex: none; background: #181818; border-top: 1px solid #2b2b2b; display: flex; align-items: center; font-size: 12px; color: #cccccc; }
.statusbar .si { padding: 0 8px; display: flex; align-items: center; gap: 5px; height: 22px; white-space: nowrap; }
.statusbar .si.remote { background: #0078d4; color: #fff; padding: 0 10px; }
.statusbar .right { margin-left: auto; display: flex; }
.ico { display: inline-block; width: 16px; height: 16px; vertical-align: middle; }
.ico svg { width: 16px; height: 16px; display: block; }

/* Syntax (Dark+ token colors; the reader resolves the same Shiki theme as the editor) */
.k { color: #569cd6; } .kc { color: #c586c0; } .s { color: #ce9178; } .n { color: #b5cea8; } .t { color: #4ec9b0; } .f { color: #dcdcaa; } .v { color: #9cdcfe; } .c { color: #6a9955; } .p { color: #d4d4d4; }

/* ── Native diff editor ───────────────────────────────────────────────── */
.ned { position: absolute; inset: 0; display: flex; font: 13px/19px var(--mono); }
.ned .pane { flex: 1; min-width: 0; overflow: hidden; position: relative; }
.ned .pane + .pane { border-left: 1px solid #2b2b2b; }
.ned .row { display: flex; height: 19px; white-space: pre; }
.ned .gn { width: 44px; flex: none; text-align: right; padding-right: 12px; color: #6e7681; }
.ned .gn.cur { color: #cccccc; }
.ned .gm { width: 18px; flex: none; color: #8b8b8b; text-align: center; }
.ned .code { flex: 1; min-width: 0; overflow: hidden; padding-left: 2px; }
.ned .row.add { background: rgba(155, 185, 85, .20); }
.ned .row.del { background: rgba(255, 0, 0, .20); }
.ned .row.add .gm { color: #9bb955; } .ned .row.del .gm { color: #f14c4c; }
.ned .row.fill { background: repeating-linear-gradient(-45deg, transparent 0 4px, rgba(204,204,204,.07) 4px 5px); }
.ned .row.sel .code { background: rgba(38, 79, 120, .75); }
.ned .row.lit { box-shadow: inset 3px 0 0 #3794ff; }
.ned .lens { height: 19px; padding-left: 64px; font: 11.5px/19px var(--ui); color: #999; white-space: nowrap; overflow: hidden; }
.ned .lens a { color: #999; text-decoration: none; }
.ned .lens .bar { color: #555; padding: 0 6px; }
.ned .ruler { position: absolute; right: 0; top: 0; bottom: 0; width: 14px; border-left: 1px solid #2b2b2b; background: #1f1f1f; }
.ned .ruler i { position: absolute; right: 2px; width: 4px; display: block; }
.ned .chap { position: absolute; left: 0; width: 3px; }

/* ── Native widgets ───────────────────────────────────────────────────── */
.hover { position: absolute; z-index: 20; background: #202020; border: 1px solid #454545; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.5); font: 13px/1.45 var(--ui); color: #cccccc; width: 460px; }
.hover .hcode { font: 12.5px/18px var(--mono); padding: 8px 10px; white-space: pre-wrap; border-bottom: 1px solid #454545; }
.hover .hdoc { padding: 8px 10px; }
.hover .hguide { flex-wrap: wrap; padding: 7px 10px; border-top: 1px solid #454545; display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: #b8b8b8; }
.hover .hacts { padding: 6px 10px; border-top: 1px solid #454545; display: flex; gap: 14px; font-size: 12.5px; }
.hover .hacts a { color: #4daafc; text-decoration: none; }
.hover .hacts kbd { font: 11px var(--ui); color: #8b8b8b; margin-left: 4px; }
.cmt { background: #1f1f1f; border-top: 2px solid #0078d4; border-bottom: 2px solid #0078d4; font: 13px/1.5 var(--ui); color: #cccccc; }
.cmt .head { height: 28px; display: flex; align-items: center; padding: 0 12px; background: #252526; color: #cccccc; }
.cmt .head .r { margin-left: auto; color: #9d9d9d; display: flex; gap: 10px; }
.cmt .body { padding: 10px 14px 10px 14px; }
.cmt .msg { display: flex; gap: 10px; margin-bottom: 10px; }
.cmt .av { width: 22px; height: 22px; border-radius: 4px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.cmt .who { font-weight: 600; color: #e6e6e6; }
.cmt .who span { font-weight: 400; color: #9d9d9d; font-style: italic; margin-left: 6px; }
.cmt .inp { border: 1px solid #0078d4; background: #313131; border-radius: 2px; height: 52px; padding: 6px 8px; font: 12.5px var(--mono); color: #cccccc; }
.cmt .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.vbtn { background: #0078d4; color: #fff; border-radius: 2px; padding: 3px 10px; font-size: 12.5px; display: inline-block; }
.vbtn.sec { background: #313131; color: #cccccc; border: 1px solid #3c3c3c; }
.cmt a, .vs a { color: #4daafc; text-decoration: none; }
.cmt code { font: 12px var(--mono); background: #2b2b2b; padding: 1px 4px; border-radius: 3px; }

/* ── Plannotator guide reader (guide-viewer chain, tokens mapped onto the editor theme) ── */
.rd { position: absolute; inset: 0; overflow: hidden; background: #1f1f1f; color: #d4d4d4; font: 13.5px/1.6 var(--ui); }
.rd { --card: #242424; --border: #343434; --muted: #2c2c2c; --mf: #9d9d9d; --primary: #3794ff; --link: #4daafc; --code-bg: #2d2d2d; }
.rd .strip { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid #2b2b2b; background: #1c1c1c; white-space: nowrap; }
.rd .strip .t { font-weight: 600; color: #e6e6e6; overflow: hidden; text-overflow: ellipsis; min-width: 0; font-size: 13px; }
.rd .strip .meta { color: var(--mf); font-size: 12px; }
.rd .steps { display: flex; gap: 4px; margin-left: auto; }
.rd .step { height: 24px; min-width: 26px; padding: 0 8px; border-radius: 12px; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #b8b8b8; }
.rd .step.on { border-color: #3794ff; color: #fff; background: rgba(55,148,255,.12); }
.rd .step.done { color: #89d185; }
.rd .racts { display: flex; gap: 6px; }
.rd .rbtn { height: 24px; padding: 0 9px; border-radius: 5px; border: 1px solid var(--border); display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #cccccc; background: #252525; white-space: nowrap; }
.rd .rbtn.pri { background: #0078d4; border-color: #0078d4; color: #fff; }
.rd .scroll { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; overflow: hidden; padding: 14px 18px 0; }
.rd.nostrip .scroll { top: 0; }
.chrow { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: 8px; background: rgba(255,255,255,.015); padding: 10px 14px; margin-bottom: 12px; }
.chrow .tt { flex: 1; color: #b8b8b8; font-size: 14px; font-weight: 500; }
.chrow .m { color: #8b8b8b; font-size: 11.5px; }
.chrow .pos { font: 10.5px var(--mono); color: #6e6e6e; }
.pcb { width: 15px; height: 15px; border-radius: 4px; border: 1px solid #6b6b6b; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; flex: none; color: #fff; }
.pcb.on { background: var(--primary); border-color: var(--primary); }
.card { border: 1px solid var(--border); border-radius: 8px; background: var(--card); overflow: hidden; margin-bottom: 12px; display: grid; }
.card .prose { border-right: 1px solid #333; padding: 18px 20px; min-width: 0; }
.card .prose h3 { margin: 0; font-size: 15px; line-height: 1.35; color: #f0f0f0; font-weight: 600; }
.card .pmeta { margin-top: 8px; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--mf); }
.card .pmeta .pos { font: 11px var(--mono); color: #7b7b7b; }
.card .prose p { margin: 12px 0 0; color: #c2c2c2; font-size: 13.5px; }
.card .prose code, .rd code { font: 12px var(--mono); background: var(--code-bg); color: #e0e0e0; padding: 1px 5px; border-radius: 4px; }
.callout { margin-top: 12px; border-radius: 6px; background: rgba(180,128,215,.12); border-left: 3px solid #b180d7; padding: 9px 12px; font-size: 13px; color: #cfc6d8; }
.callout b { display: block; font-size: 11px; letter-spacing: .06em; color: #c9a7e6; margin-bottom: 3px; }
.flist { margin-top: 16px; display: grid; gap: 6px; }
.fchip { display: flex; align-items: center; gap: 8px; border: 1px solid #333; border-radius: 6px; padding: 6px 10px; background: #1b1b1b; font: 11px var(--mono); }
.fchip.on { border-color: #3794ff; background: rgba(55,148,255,.08); }
.fchip .nm { color: #e6e6e6; font-weight: 600; }
.fchip .dr { color: #7b7b7b; font-size: 10px; flex: 1; }
.fchip .a { color: #89d185; } .fchip .d { color: #f48771; }
.askin { margin-top: 14px; border: 1px solid #3c3c3c; border-radius: 6px; padding: 7px 10px; color: #8b8b8b; font-size: 12.5px; background: #1b1b1b; display: flex; gap: 6px; align-items: center; }
.diffs { background: rgba(255,255,255,.012); padding: 14px 16px; min-width: 0; }
.fsum { color: #c2c2c2; font-size: 13px; margin: 2px 2px 8px; }
.pfile { border-radius: 8px; overflow: hidden; background: #181818; border: 1px solid #2c2c2c; margin-bottom: 14px; }
.pfile .ph { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px; font: 12.5px var(--ui); color: #b8b8b8; border-bottom: 1px solid #262626; }
.pfile .ph .dir { color: #8b8b8b; } .pfile .ph .nm { color: #f0f0f0; font-weight: 600; }
.pfile .ph .a { color: #89d185; font: 12px var(--mono); } .pfile .ph .d { color: #f48771; font: 12px var(--mono); }
.pfile .ph .fa { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pfile .ph .lnk { color: #4daafc; font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
.pd { font: 12.5px/19px var(--mono); }
.pd .r { display: flex; white-space: pre; height: 19px; }
.pd .o, .pd .nn { width: 34px; flex: none; text-align: right; padding-right: 8px; color: #5f6670; }
.pd .bar { width: 3px; flex: none; }
.pd .cd { flex: 1; min-width: 0; overflow: hidden; padding-left: 10px; }
.pd .r.add { background: rgba(46,160,67,.13); } .pd .r.add .bar { background: #2ea043; } .pd .r.add .nn { color: #7fbf8a; }
.pd .r.del { background: rgba(248,81,73,.12); } .pd .r.del .bar { background: #f85149; } .pd .r.del .o { color: #d98a85; }
.pd .r.sel { background: rgba(55,148,255,.16); } .pd .r.sel .bar { background: #3794ff; }
.pd .r.flash { box-shadow: inset 0 0 0 1px #3794ff; background: rgba(55,148,255,.10); }
.pd .r.hunk { color: #6e7681; background: rgba(55,148,255,.05); font-size: 11.5px; }
.pd .r.hunk .cd { color: #7d8590; }
.pn-token-hover { text-decoration: underline; text-decoration-color: #4daafc; text-underline-offset: 3px; cursor: pointer; }
.pn-token-nav { text-decoration: underline; text-decoration-color: #4daafc; color: #4daafc !important; }
.cursor { position: absolute; z-index: 30; width: 14px; height: 20px; pointer-events: none; }
.rcard { background: #202020; border: 1px solid #3c3c3c; border-radius: 8px; box-shadow: 0 10px 30px -8px rgba(0,0,0,.6); font: 13px/1.5 var(--ui); color: #cccccc; }
.thread { margin: 6px 12px 10px 46px; border: 1px solid #3c3c3c; border-left: 3px solid #3794ff; border-radius: 8px; background: #1c1c1c; font: 13px/1.55 var(--ui); white-space: normal; }
.thread .q { padding: 10px 14px; border-bottom: 1px solid #2c2c2c; display: flex; gap: 10px; }
.thread .a { padding: 12px 14px; }
.thread .who { font-size: 12px; color: #9d9d9d; }
.thread .who b { color: #e6e6e6; font-weight: 600; }
.thread h4 { margin: 4px 0 8px; font-size: 14px; color: #f0f0f0; }
.thread p { margin: 8px 0; color: #c8c8c8; }
.thread a, .rd a { color: var(--link); text-decoration: none; }
.thread .tacts { display: flex; gap: 6px; padding: 8px 14px; border-top: 1px solid #2c2c2c; align-items: center; }
.thread .fu { flex: 1; border: 1px solid #3c3c3c; border-radius: 6px; padding: 5px 9px; color: #8b8b8b; font-size: 12.5px; background: #181818; }
.mini { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font: 11.5px var(--mono); margin: 8px 0; background: #181818; border: 1px solid #2c2c2c; border-radius: 6px; padding: 10px 12px; }
.mini .lab { font: 10.5px var(--ui); letter-spacing: .08em; color: #8b8b8b; text-transform: uppercase; }
.mini .flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mini .bx { border: 1px solid #555; border-radius: 4px; padding: 2px 7px; color: #ddd; }
.mini .bx.r { border-color: #f14c4c; } .mini .bx.g { border-color: #89d185; } .mini .bx.y { border-color: #e2b93d; } .mini .bx.b { border-color: #3794ff; }
.mini .ar { color: #777; }
.toast { position: absolute; z-index: 25; background: #252526; border: 1px solid #454545; border-radius: 6px; padding: 8px 12px; font-size: 12.5px; color: #cccccc; box-shadow: 0 6px 20px rgba(0,0,0,.5); display: flex; gap: 10px; align-items: center; }
.toast a { color: #4daafc; }
.note { position: absolute; z-index: 40; background: #ffd866; color: #1e1e1e; font: 600 12px/1.35 var(--ui); padding: 6px 9px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.5); max-width: 260px; }
.note::before { content: attr(data-n); display: inline-flex; width: 17px; height: 17px; border-radius: 50%; background: #1e1e1e; color: #ffd866; align-items: center; justify-content: center; font-size: 10.5px; margin-right: 6px; }

/* Notebook */
.nb { position: absolute; inset: 0; background: #1f1f1f; overflow: hidden; }
.nb .ntool { height: 30px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid #2b2b2b; font-size: 12.5px; color: #cccccc; }
.nb .ntool .k { margin-left: auto; color: #cccccc; display: flex; gap: 6px; align-items: center; }
.nb .cells { position: absolute; top: 30px; left: 0; right: 0; bottom: 0; overflow: hidden; padding: 10px 26px 0 22px; }
.cell { position: relative; margin: 0 0 10px 18px; }
.cell .fb { position: absolute; left: -16px; top: 2px; bottom: 2px; width: 3px; border-radius: 2px; }

+import { db } from "../db";
+import type { WebhookJob } from "./types";
+
+export interface DeadLetterInfo {
+  status: number;
+  attempts: number;
+}
+
+export const deadLetters = {
+  /** Idempotent: a job is dead-lettered at most once. */
+  async put(job: WebhookJob, info: DeadLetterInfo): Promise<void> {
+    await db
+      .insertInto("webhook_dead_letters")
+      .values({
+        job_id: job.id,
+        endpoint: job.endpoint,
+        payload: JSON.stringify(job.payload),
+        last_status: info.status,
+        attempts: info.attempts,
+      })

+};

+import type { Config } from "../config/schema";
+
+/** How often and how long a failed delivery is retried. */
+export interface RetryPolicy {
+  maxAttempts: number;
+  baseDelayMs: number;
+  maxDelayMs: number;
+  attemptTimeoutMs: number;
+}
+
+export function retryPolicyFrom(config: Config): RetryPolicy {
+  return config.webhooks.retry;
+}
+
+/** Exponential backoff with full jitter, clamped to policy.maxDelayMs. */
+export function computeBackoff(attempt: number, policy: RetryPolicy): number {
+  const ceiling = Math.min(policy.maxDelayMs, policy.baseDelayMs * 2 ** attempt);
+  return Math.floor(Math.random() * ceiling);
+}
+
+/** 5xx and 429 are worth another try; everything else is final. */
+export function isRetryable(status: number): boolean {
+  return status === 429 || status >= 500;
+}
</script>
<script type="text/plain" id="f-sign">import { createHmac } from "node:crypto";
import { secrets } from "../config/secrets";
import type { WebhookJob } from "./types";

/** HMAC-SHA256 over the raw body, sent as X-Signature. */
export function signHeaders(job: WebhookJob): Record<string, string> {
  const body = JSON.stringify(job.payload);
  const sig = createHmac("sha256", secrets.webhookKey).update(body).digest("hex");
  return { "X-Signature": `sha256=${sig}`, "X-Webhook-Id": job.id };
}

const params = new URLSearchParams(location.search);
if (params.get("shot")) document.body.classList.add("shot");
let vi = Math.max(0, VARIANTS.findIndex((v) => v.id === (params.get("variant") || "a").toLowerCase()));
let si = Math.max(0, Math.min(VARIANTS[vi].states.length - 1, (+params.get("state") || 1) - 1));

function placeAnchors() {
  const vs = document.getElementById("vs"); if (!vs) return;
  const base = vs.getBoundingClientRect();
  vs.querySelectorAll("[data-anchor]").forEach((el) => {
    const t = vs.querySelector(`[id="${el.dataset.anchor}"]`); if (!t || t === el) return;
    const r = t.getBoundingClientRect();
    el.style.position = "absolute"; el.style.zIndex = el.classList.contains("hover") ? 20 : 30;
    let left = r.left - base.left + (+el.dataset.dx || 0), top = r.bottom - base.top + (+el.dataset.dy || 0);
    if (el.classList.contains("hover")) left = Math.min(left, 1440 - el.offsetWidth - 20);
    el.style.left = left + "px"; el.style.top = top + "px";
  });
}
function tablist(host, items, sel, onPick) {
  host.innerHTML = items.map((t, i) => `<button role="tab" aria-selected="${i === sel}" tabindex="${i === sel ? 0 : -1}" data-i="${i}">${t}</button>`).join("");
  host.onclick = (e) => { const b = e.target.closest("[role=tab]"); if (b) onPick(+b.dataset.i, true); };
  host.onkeydown = (e) => {
    const n = items.length; let i = sel;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") i = (sel + 1) % n;
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp") i = (sel - 1 + n) % n;
    else if (e.key === "Home") i = 0; else if (e.key === "End") i = n - 1; else return;
    e.preventDefault(); onPick(i, true);
  };
}
function render(focus) {
  const v = VARIANTS[vi];
  const url = new URL(location.href); url.searchParams.set("variant", v.id); url.searchParams.set("state", si + 1);
  history.replaceState(null, "", url);
  tablist(document.getElementById("vtabs"), VARIANTS.map((x) => x.name), vi, (i, f) => { vi = i; si = 0; render(f && "v"); });
  tablist(document.getElementById("stabs"), v.states.map((_, i) => `${i + 1}`), si, (i, f) => { si = i; render(f && "s"); });
  document.getElementById("cap").innerHTML = `<b>${v.name}, state ${si + 1}.</b> ${v.states[si]}`;
  document.getElementById("frame").innerHTML = v.fn(si + 1);
  placeAnchors();
  if (focus) document.querySelector(`#${focus === "v" ? "vtabs" : "stabs"} [aria-selected=true]`).focus();
  if (params.get("notes") === "0") document.querySelectorAll(".note").forEach((n) => n.remove());
}
render();
